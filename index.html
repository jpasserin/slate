<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0f15">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Slate">
<title>Slate</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  /* Tally's tokens, unchanged, so the family of apps looks like one. */
  :root{
    --bg:#0d0f15; --bg2:#11131a; --card:#181b24; --card2:#1f2330; --line:#272b38;
    --txt:#eef1f7; --muted:#8a92a6; --accent:#3b82f6; --accent2:#7cb8ff;
    --good:#4ade80; --bad:#f87171; --warn:#fbbf24; --r:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;font-size:14px;}
  body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);}
  .wrap{max-width:560px;margin:0 auto;padding:16px 16px 24px;}

  header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
    margin:0 -16px 12px;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line);}
  /* The name is a button: it opens the About widget. */
  header h1{font-size:20px;margin:0;letter-spacing:.3px;cursor:pointer;user-select:none;-webkit-user-select:none}
  header h1 .dot{color:var(--accent)}
  header .hdrright{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;font-weight:600}
  .syncdot{font-size:11px;font-weight:600;color:var(--muted)}
  .hdrbtn{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;width:28px;height:26px;
    cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0}
  .hdrbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .hdrbtn:active{color:var(--accent)}
  .hdrbtn.on{color:var(--accent);border-color:var(--accent)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;}
  .card h2{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);
    margin:0 0 6px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .card h2 .n{color:var(--txt);font-variant-numeric:tabular-nums;margin-left:6px}
  .card h2 .ttl{display:flex;align-items:center;min-width:0}
  .bmedit{background:none;border:1px solid var(--line);border-radius:7px;height:22px;width:26px;margin-left:8px;padding:0;font-size:11px;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;flex:none}
  .card h2 .hbtns{display:flex;align-items:center;gap:7px;text-transform:none;letter-spacing:0;font-weight:400}
  .muted{color:var(--muted)}
  .empty{font-size:12.5px;color:var(--muted);padding:8px 0 4px}

  /* A widget over the bottom half of the screen (About, a bookmark). */
  .sheetwrap{position:fixed;inset:0;z-index:40}
  .scrim{position:absolute;inset:0;background:rgba(0,0,0,.5)}
  .sheet{position:absolute;left:0;right:0;bottom:0;max-height:82vh;background:var(--card);
    border-top:1px solid var(--line);border-radius:20px 20px 0 0;padding:14px 16px calc(12px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:5px;overflow-y:auto;max-width:560px;margin:0 auto}
  /* Slides up once, when it opens; a redraw from a chip inside must not replay it. */
  .sheet.enter{animation:up .28s cubic-bezier(.2,.8,.2,1)}
  @keyframes up{from{transform:translateY(100%)}to{transform:none}}
  .sheet h3{margin:0 0 2px;font-size:16px}
  .sheet .foot{display:flex;gap:8px;padding-top:4px}
  .sheet .foot .btn.close{flex:0 0 auto;min-width:92px;background:var(--bg2)}
  .sheet .foot .btn.close.arm{background:var(--bad);border-color:var(--bad);color:#fff}

  /* A page of its own (a task, its editor): the content, then Close at the
     bottom, always in reach however long the page. */
  .page{padding-bottom:4px}
  .page .ptitle{display:flex;align-items:flex-start;gap:10px;margin:2px 0 10px}
  .page .ptitle h2{flex:1;margin:0;font-size:19px;line-height:1.25;overflow-wrap:anywhere}
  .page .ptitle .gbtn{height:28px;min-width:32px;font-size:14px}
  .page .sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:600;margin:12px 0 5px;
    display:flex;align-items:center;justify-content:space-between;gap:8px}
  .page .sec .gbtn{height:20px;min-width:22px;font-size:13px}
  .page .stamp{font-size:11px;color:var(--muted);margin-top:12px}
  .page .info{white-space:pre-wrap;font-size:13.5px;line-height:1.45;overflow-wrap:anywhere}
  .closebar{position:sticky;bottom:0;z-index:12;margin:14px -16px 0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));
    display:flex;gap:8px;background:linear-gradient(to top,var(--bg) 72%,transparent)}
  .closebar .btn{padding:13px;font-size:15px}
  .closebar .btn.close{flex:1;background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 6px 22px rgba(0,0,0,.45)}

  .field{margin-bottom:6px}
  .field>label,.field .lab{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:10.5px;color:var(--muted);
    margin-bottom:2px;text-transform:uppercase;letter-spacing:.5px}
  .field .lab .gbtn{height:20px;min-width:22px;font-size:13px}
  input,select,textarea{width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--txt);border-radius:10px;
    padding:5px 10px;font-size:14px;font-family:inherit;outline:none}
  textarea{resize:vertical;min-height:70px;line-height:1.4}
  input:focus,textarea:focus{border-color:var(--accent)}
  input[type=date]{color-scheme:dark}
  .btnrow{display:flex;gap:7px}
  .btn{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:11px;padding:8px 14px;
    font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;flex:1}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn:disabled{opacity:.45;cursor:default}
  .btn.danger{flex:0 0 auto;background:var(--bg2);border-color:var(--bad);color:var(--bad)}
  .btn.danger.arm{background:var(--bad);color:#fff}
  .status{font-size:12.5px;margin-top:6px;font-weight:600}
  .status.ok{color:var(--good)} .status.bad{color:var(--bad)}

  .rows .row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
  .rows .row:last-child{border-bottom:0}
  .row .k{font-size:13.5px} .row .v{font-weight:700;font-variant-numeric:tabular-nums}

  /* Top-right group button: contour and the blue ground. */
  .gbtn{background:var(--accent);border:1px solid var(--accent);color:#fff;border-radius:8px;min-width:26px;height:24px;
    padding:0 7px;font-size:14px;font-weight:700;line-height:1;cursor:pointer;font-family:inherit;
    display:inline-flex;align-items:center;justify-content:center;text-transform:none;letter-spacing:0}

  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{background:var(--card2);border:1px solid var(--line);border-radius:18px;padding:4px 10px;color:var(--txt);
    font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .chip.sm{padding:2px 9px;font-size:11.5px}
  .chip.add{background:none;color:var(--muted);border-style:dashed}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
  .cap{font-size:11.5px;font-weight:600;border-radius:12px;padding:2px 9px;border:1px solid var(--line);color:var(--txt);background:var(--card2);
    display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .cap .x{opacity:.65;cursor:pointer;font-weight:700}
  .caps{display:flex;flex-wrap:wrap;gap:5px}
  .tagbox{display:flex;flex-wrap:wrap;gap:5px;align-items:center;background:var(--bg2);border:1px solid var(--line);
    border-radius:10px;padding:3px 8px;cursor:text;min-height:30px}
  .tagbox:focus-within{border-color:var(--accent)}
  .tagbox input{flex:1;min-width:90px;width:auto;background:none;border:0;padding:2px 2px}
  .sugg{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}

  /* The status: a dot of its colour. Backlog is black, so it gets a ring. */
  .sdot{display:inline-block;width:11px;height:11px;border-radius:50%;flex:none}
  .sdot.ring{box-shadow:0 0 0 1.5px var(--muted) inset}
  .spick{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 2px}

  /* A switch: a label with a sliding knob. */
  .switch{display:flex;align-items:center;gap:10px;margin-top:4px;cursor:pointer;font-size:13.5px}
  .switch .track{width:40px;height:22px;border-radius:11px;background:var(--line);position:relative;transition:background .15s;flex:none}
  .switch .track::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
  .switch .track.on{background:var(--accent)}
  .switch .track.on::after{left:20px}

  /* The progress bar: next steps done over all of them. */
  .bbar{height:5px;background:var(--bg2);border-radius:4px;overflow:hidden;margin:2px 0 6px}
  .bbar i{display:block;height:100%;border-radius:4px;background:var(--accent)}
  .bbar i.full{background:var(--good)}

  /* A tick box. */
  .ck{width:18px;height:18px;border:1.5px solid var(--muted);border-radius:5px;flex:none;display:inline-flex;align-items:center;
    justify-content:center;font-size:12px;color:#fff;cursor:pointer;font-weight:700}
  .ck.on{background:var(--accent);border-color:var(--accent)}

  /* The list: a dot and a name, one line each; the handle drags it. */
  .trow{display:flex;align-items:center;gap:11px;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .trow:last-child{border-bottom:0}
  .trow .tn{flex:1;min-width:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .trow.done .tn{color:var(--muted)}
  .trow.lift{background:var(--card2);border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.4);padding-left:6px}
  .drag{color:var(--muted);font-size:16px;line-height:1;padding:2px 2px 2px 10px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;flex:none}

  /* Bookmarks: the saved lists, along the top. */
  .bmbar{display:flex;gap:6px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none}
  .bmbar::-webkit-scrollbar{display:none}
  .bmbar .chip{flex:none}

  /* The filter, Bench's pattern by way of Tally: one round button, a panel
     that drops under it, chips for what is active. */
  .fdrop{position:relative}
  .fbtn{width:34px;height:26px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);color:var(--txt);cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;font-size:13px;padding:0}
  .fbtn.act{border-color:var(--accent);color:var(--accent2)}
  .fscrim{position:fixed;inset:0;z-index:8}
  .fmenu{position:absolute;right:0;top:100%;z-index:9;margin-top:6px;width:min(320px,88vw);display:flex;flex-direction:column;
    background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px;box-shadow:0 8px 24px -8px rgba(0,0,0,.6);
    text-align:left;font-weight:400;text-transform:none;letter-spacing:0}
  .fsearch{position:relative;margin-bottom:6px}
  .fsearch input{padding-right:30px}
  .fsearch .fx{position:absolute;right:9px;top:50%;transform:translateY(-50%);color:var(--muted);cursor:pointer;font-size:16px}
  .ovf-addf,.ovf-exclf{display:block;width:100%;text-align:left;background:none;border:none;font-size:13px;font-weight:600;padding:7px 9px;
    border-radius:7px;cursor:pointer;font-family:inherit}
  .ovf-addf{color:#4a9eff} .ovf-exclf{color:#ff5c6c}
  .ovf-exclf:disabled{opacity:.4;cursor:default}
  .fpick{max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:8px;margin:2px 0 6px}
  .fpick .grp{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:600;padding:7px 9px 2px}
  .fpick button{display:flex;align-items:center;gap:7px;width:100%;text-align:left;background:none;border:none;color:var(--txt);font-size:12.5px;padding:6px 9px 6px 16px;cursor:pointer;font-family:inherit}
  .fchips{display:flex;flex-wrap:wrap;gap:5px;margin:2px 0 6px}
  .fchip{display:inline-flex;align-items:center;gap:5px;background:var(--accent);color:#fff;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:600}
  .fchip.exc{background:#ff5c6c}
  .fchip.plain{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
  .fchip b{cursor:pointer;opacity:.75;font-weight:700}

  /* The editor's own lists: next steps, updates, costs. */
  .li{display:flex;align-items:center;gap:6px;margin-bottom:4px}
  .li input{padding:4px 8px;font-size:13px;min-width:0}
  .li input.d{flex:0 0 132px}
  .li input.a{flex:0 0 84px;text-align:right}
  .li .x{color:var(--muted);cursor:pointer;font-size:17px;line-height:1;padding:0 2px;flex:none}
  .li.done input.t{color:var(--muted);text-decoration:line-through}
  /* ...and as they read on the task's page. */
  .vli{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:13.5px}
  .vli .t{flex:1;min-width:0;overflow-wrap:anywhere}
  .vli.done .t{color:var(--muted);text-decoration:line-through}
  .vli .v{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
  .when{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;flex:none}
  .when.due{color:var(--warn)} .when.late{color:var(--bad)}
  .trow .when{font-size:11.5px}
  .li input.d{flex:0 0 118px;padding:4px 6px}
  .addupd{display:flex;gap:6px;align-items:flex-end;margin-bottom:6px}
  .addupd textarea{min-height:44px}
  .addupd .btn{flex:0 0 auto;padding:8px 12px}
  .lnk{color:var(--accent2);text-decoration:none;font-size:13.5px;overflow-wrap:anywhere;flex:1;min-width:0}
  .li input.t{flex:1 1 0}
  .li input.u{flex:1.4 1 0}
  .upd{display:flex;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
  .upd .when{flex:0 0 46px;padding-top:2px}
  .upd .info{flex:1;min-width:0}
  .tot{display:flex;justify-content:flex-end;gap:12px;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;padding:2px 0 0}
</style>
</head>
<body>
<div class="wrap">
  <header><h1 id="appTitle"></h1>
    <div class="hdrright"><span id="syncDot"></span><span id="setBtn"></span></div></header>
  <div id="tabs"></div>
</div>

<script src="backend.js?v=5"></script>
<script>
const APP_VERSION="5";
const BK = window.SlateBackend;

/* ------------------------------------------------------------------ store --
   Everything this device remembers, in one localStorage key. */
const KEY = 'slate-v1';
function loadStore(){ try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
const store = Object.assign({ backend:{ url:'', token:'' }, backendVersion:null, tasks:[], bookmarks:[], dirty:[], syncedAt:null,
  bm:'all', filter:null }, loadStore());
/* v1 marked a waiting task by its id alone; now a key says which tab. */
const migrateKey = (k) => /^[TB]:/.test(k) ? k : 'T:'+k;
store.dirty = (store.dirty||[]).map(migrateKey);
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) { /* private mode */ } };
const state = { tab:'tasks', view:null, edit:null, about:null, bmEdit:null, sync:null, fopen:false, fpick:null, statPick:false, listY:0 };

/* ------------------------------------------------------------- the model --
   A task: a name, a status, the day it was made and the moment it last
   changed, its next steps (each ticked off, each maybe due on a day; their
   progress), its updates (each dated the day it was written), tags,
   assignees, and a cost list in euros or dollars. A deleted task keeps its row, Deleted filled, so a
   phone that still has it cannot bring it back. */
const STATUSES = ['Backlog','Todo','In progress','Blocked','Action needed','Done'];
const STATUS_COLOR = { 'Backlog':'#000000', 'Todo':'#8a92a6', 'In progress':'#3b82f6', 'Blocked':'#f87171', 'Action needed':'#fbbf24', 'Done':'#4ade80' };
const sdot = (s) => `<span class="sdot${s==='Backlog'?' ring':''}" style="background:${STATUS_COLOR[s]||'#8a92a6'}"></span>`;
const SYM = { EUR:'€', USD:'$' };
const NOW = () => new Date().toISOString();
const ymd = (d) => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const TODAY = () => ymd(new Date());
/* Sunday of this week: a reminder up to it is due. */
const weekEnd = () => { const d = new Date(); d.setDate(d.getDate() + (7 - (d.getDay() || 7))); return ymd(d); };
const uid = (p) => (p||'t') + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const live = () => store.tasks.filter((t)=>!t.deleted);
const blank = (status) => ({ id:'', name:'', status:status||'Todo', created:'', updated:'', doneOn:'',
  steps:[], updates:[], links:[], tags:[], assignees:[], costs:[], deleted:'' });
const progress = (t) => { const n = t.steps.length, d = t.steps.filter((i)=>i.done).length; return { n, d, pct: n ? Math.round(d*100/n) : 0 }; };
/* v1-v2 kept a checklist and reminders apart, a note in Infos and a This
   week switch. Now: the checklist and the reminders are the next steps (a
   reminder is a step with its date due), the note is the first update,
   dated the day the task last changed, and This week is any task with a
   step due this week. Nothing typed is lost. */
function migrateTask(t){
  if (t && !Array.isArray(t.links)) t.links = [];           // links came in v5: none yet, nothing to send
  if (!t || Array.isArray(t.steps) && Array.isArray(t.updates) && !('checklist' in t) && !('reminders' in t) && !('info' in t) && !('week' in t)) return false;
  t.steps = (t.steps||[]).concat((t.checklist||[]).map((i)=>({ done:!!i.done, text:i.text||'', due:'' })),
    (t.reminders||[]).map((r)=>({ done:!!r.done, text:r.text||'', due:r.date||'' })));
  t.updates = (t.updates||[]).concat(t.info ? [{ date:String(t.updated||t.created||NOW()).slice(0,10), text:t.info }] : []);
  delete t.checklist; delete t.reminders; delete t.info; delete t.week;
  return true;
}
/* The step that comes next: the earliest due one not done. */
const nextDue = (t) => { let d = ''; for (const s of t.steps) if (!s.done && s.due && (!d || s.due < d)) d = s.due; return d; };
/* A link as typed: an address with no scheme gets https://; only web
   addresses open, so a link is never anything but a page. */
const linkUrl = (u) => { const v = String(u||'').trim(); if (!v) return ''; return /^[a-z][a-z0-9+.-]*:/i.test(v) ? v : 'https://' + v.replace(/^\/+/, ''); };
const safeUrl = (u) => /^https?:\/\//i.test(u) ? u : '';
/* what a link shows when it has no label: the site and the path, short */
const linkText = (l) => l.label || String(l.url).replace(/^https?:\/\/(www\.)?/i, '').replace(/\/$/, '');
/* This week: a step not done, due by Sunday - the late ones too. */
const dueThisWeek = (t) => { const d = nextDue(t); return !!d && d <= weekEnd(); };
const dueClass = (d) => !d ? '' : d < TODAY() ? 'late' : d <= weekEnd() ? 'due' : '';
const r2 = (x) => Math.round(x*100)/100;
/* an amount as typed: a comma is a decimal point too */
const num = (a) => { const s = String(a==null?'':a).replace(',', '.').trim(); return s==='' || !isFinite(+s) ? null : +s; };
const costTotals = (costs) => { const out = {}; for (const c of costs) { const v = num(c.amount); if (v!=null) out[c.cur] = r2((out[c.cur]||0) + v); } return out; };
const money = (v, cur) => (v<0?'-':'') + SYM[cur] + Math.abs(v).toLocaleString('en-US', { minimumFractionDigits:2, maximumFractionDigits:2 });
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dLabel = (d) => { if (!d) return ''; const s = String(d).slice(0,10); const [y,m,dd] = s.split('-');
  return (+dd) + ' ' + MON[+m-1] + (y===TODAY().slice(0,4) ? '' : ' ' + y); };
/* Known tags and people: everything any task carries, most used first. */
const known = (field) => { const n = {}; for (const t of live()) for (const x of t[field]) n[x] = (n[x]||0) + 1;
  return Object.keys(n).sort((a,b)=>n[b]-n[a] || a.localeCompare(b)); };
const same = (a, b) => String(a).trim().toLowerCase() === String(b).trim().toLowerCase();
/* One colour per name, the same on every phone. */
const PALETTE = ['#3b82f6','#4ade80','#fbbf24','#f87171','#a78bfa','#22d3ee','#fb923c','#f472b6'];
const colorOf = (s) => { let h = 0; for (const c of String(s).toLowerCase()) h = (h*31 + c.charCodeAt(0)) >>> 0; return PALETTE[h % PALETTE.length]; };
/* The status a task moves to, and the day it was done with it. */
function setStatus(t, s){ if (s==='Done' && t.status!=='Done') t.doneOn = TODAY(); if (s!=='Done') t.doneOn = ''; t.status = s; }

/* --------------------------------------------------------------- filters --
   Bench's way: a search, then + filters (keep what has one of them) and −
   filters (drop what has any), on the status, the tags, the assignees and
   when the next step is due. Within one kind any value will do; across
   kinds, all of them. Done tasks stay out of a list unless its filter picks
   a status. */
const KINDS = [['status','Status'], ['due','Due'], ['person','Assignee'], ['tag','Tag']];
const KIND_LABEL = Object.fromEntries(KINDS);
const NONE = '(none)';
/* Due: This week (a step due by Sunday, the late ones too), Later, or (none). */
const DUES = ['This week', 'Later'];
const dueOf = (t) => { const d = nextDue(t); return !d ? [] : d <= weekEnd() ? ['This week'] : ['Later']; };
const blankFilter = () => ({ q:'', inc:[], exc:[] });
const valuesOf = (t, kind) => kind==='status' ? [t.status] : kind==='tag' ? t.tags : kind==='due' ? dueOf(t) : t.assignees;
function matches(t, f){
  const q = String(f.q||'').toLowerCase().split(/\s+/).filter(Boolean);
  if (q.length) { const hay = [t.name, t.updates.map((u)=>u.text).join(' '), t.links.map((l)=>l.label+' '+l.url).join(' '), t.tags.join(' '), t.assignees.join(' '), t.steps.map((i)=>i.text).join(' ')].join(' ').toLowerCase();
    if (!q.every((w)=>hay.includes(w))) return false; }
  const has = (e) => { const v = valuesOf(t, e.kind); return e.name===NONE ? !v.length : v.some((x)=>same(x, e.name)); };
  for (const [kind] of KINDS) { const inc = f.inc.filter((e)=>e.kind===kind); if (inc.length && !inc.some(has)) return false; }
  if (f.exc.some(has)) return false;
  if (t.status==='Done' && !f.inc.some((e)=>e.kind==='status')) return false;
  return true;
}
const filterKey = (f) => JSON.stringify([String(f.q||'').trim(), f.inc.map((e)=>e.kind+':'+e.name).sort(), f.exc.map((e)=>e.kind+':'+e.name).sort()]);
const filterOn = (f) => !!(String(f.q||'').trim() || f.inc.length || f.exc.length);
const curFilter = () => store.filter || (store.filter = blankFilter());

/* -------------------------------------------------------------- bookmarks --
   A bookmark is a filter kept under a name, how its list is sorted, and its
   own order, dragged by hand. 'all' is the list with no bookmark; it keeps
   its sort and order the same way. In the custom order a task not yet
   placed shows at the top, newest first, until it is dragged. */
const SORTS = [['custom','Custom'], ['due','Due date'], ['name','Name'], ['person','Assignee'], ['status','Status']];
const SORT_LABEL = Object.fromEntries(SORTS);
/* By status: what needs a hand first. */
const STATUS_RANK = ['Action needed','Blocked','In progress','Todo','Backlog','Done'];
const bmLive = () => store.bookmarks.filter((b)=>!b.deleted);
const bmById = (id) => store.bookmarks.find((b)=>b.id===id && !b.deleted) || null;
const activeBm = () => (store.bm && store.bm!=='all' && bmById(store.bm)) || null;
const orderKey = () => activeBm() ? store.bm : 'all';
const newBm = (id, name, filter, sort) => ({ id, name, filter:filter||blankFilter(), sort:sort||'custom', order:[], updated:'', deleted:'' });
function ensureOrder(id){
  let b = store.bookmarks.find((x)=>x.id===id);
  if (!b) { b = newBm(id, id==='all' ? 'All' : ''); store.bookmarks.push(b); }
  return b;
}
const sortOf = () => { const b = store.bookmarks.find((x)=>x.id===orderKey()); return (b && b.sort) || 'custom'; };
const byName = (a, b) => a.name.localeCompare(b.name, undefined, { sensitivity:'base', numeric:true });
function shownTasks(){
  const f = curFilter(), b = store.bookmarks.find((x)=>x.id===orderKey()), ord = (b && b.order) || [], sort = sortOf();
  const ts = live().filter((t)=>matches(t, f));
  if (sort==='custom') {
    const pos = new Map(ord.map((id,i)=>[id,i]));
    const fresh = ts.filter((t)=>!pos.has(t.id)).sort((a,b)=>String(b.created).localeCompare(String(a.created)));
    return fresh.concat(ts.filter((t)=>pos.has(t.id)).sort((a,b)=>pos.get(a.id)-pos.get(b.id)));
  }
  /* a task with nothing to sort on goes last */
  const last = (x, y, cmp) => !x && !y ? 0 : !x ? 1 : !y ? -1 : cmp(x, y);
  const by = {
    due: (a,b) => last(nextDue(a), nextDue(b), (x,y)=>x.localeCompare(y)),
    name: () => 0,
    person: (a,b) => last(a.assignees[0], b.assignees[0], (x,y)=>x.localeCompare(y, undefined, { sensitivity:'base' })),
    status: (a,b) => STATUS_RANK.indexOf(a.status) - STATUS_RANK.indexOf(b.status) || last(nextDue(a), nextDue(b), (x,y)=>x.localeCompare(y)),
  }[sort] || (()=>0);
  return ts.sort((a,b)=>by(a,b) || byName(a,b));
}
/* Move the task at `from` to `to` in the list as shown; the list's order
   becomes what is shown, followed by what it held that is not showing. */
function moveTask(from, to){
  const seq = shownTasks().map((t)=>t.id);
  if (from===to || from<0 || to<0 || from>=seq.length || to>=seq.length) return false;
  const [x] = seq.splice(from, 1); seq.splice(to, 0, x);
  const b = ensureOrder(orderKey());
  const alive = new Set(live().map((t)=>t.id));
  b.order = seq.concat(b.order.filter((id)=>!seq.includes(id) && alive.has(id)));
  b.updated = NOW(); save();
  return true;
}

/* Every task kept by an older version takes the shape of this one (see
   migrateTask), and goes up again so the sheet takes it too. This week is a
   list of its own from the start: a bookmark on the Due filter, by due date
   - deletable like any other, and a phone that has never seen it makes it
   with no date, so the sheet's (or its deletion) always wins. */
for (const t of store.tasks) if (migrateTask(t) && !store.dirty.includes('T:'+t.id)) store.dirty.push('T:'+t.id);
for (const b of store.bookmarks) if (!b.sort) b.sort = 'custom';
if (!store.bookmarks.some((b)=>b.id==='week')) {
  store.bookmarks.push(newBm('week', 'This week', { q:'', inc:[{ kind:'due', name:'This week' }], exc:[] }, 'due'));
  store.dirty.push('B:week');
}

/* ------------------------------------------------------- the sheet's rows --
   Tasks: one row per task. The lists sit in one cell each, one line per
   item, written so they read well in the sheet and can be typed by hand:
     Next steps  [x] buy paint / [ ] 2026-11-12 call the plumber (a due date, if any)
     Updates     2026-11-05: what happened (newest first; a line with no date
                 goes on with the update above it)
     Costs       45.90 EUR Paint        Tags, Assignees   comma-separated
   The columns of the older versions (Checklist, Reminders, Info, This week)
   are still read, and written back empty while the sheet has them, so a row
   is moved over the first time it goes up; then they can be deleted.
   Bookmarks: one row per list; the filter one line per part
   (Search: paint / + Status: Todo / - Tag: garden), how it sorts, the order
   as task ids. */
const TASK_HEADERS = ['Id','Name','Status','Created','Updated','Done on','Tags','Assignees','Next steps','Updates','Links','Costs','Deleted'];
const LEGACY = ['Checklist','Reminders','Info','This week'];
const BM_HEADERS = ['Id','Name','Filter','Sort','Order','Updated','Deleted'];
const lines = (s) => String(s==null?'':s).split(/\r?\n/).map((x)=>x.trim()).filter(Boolean);
const list = (s) => String(s==null?'':s).split(',').map((x)=>x.trim()).filter(Boolean);
const stepLine = (s) => (s.done?'[x] ':'[ ] ') + (s.due ? s.due + ' ' : '') + s.text;
const readSteps = (cell) => lines(cell).map((l)=>{ const m = /^(?:\[([ xX])\]\s*)?(\d{4}-\d{2}-\d{2})?\s*(.*)$/.exec(l);
  return { done:!!(m[1] && m[1]!==' '), text:m[3]||'', due:m[2]||'' }; });
function readUpdates(cell){
  const out = [];
  for (const l of String(cell==null?'':cell).split(/\r?\n/)) {
    const m = /^(\d{4}-\d{2}-\d{2}):\s?(.*)$/.exec(l);
    if (m) out.push({ date:m[1], text:m[2] });
    else if (out.length) out[out.length-1].text += '\n' + l;
    else if (l.trim()) out.push({ date:'', text:l });
  }
  return out.map((u)=>({ date:u.date, text:u.text.replace(/\s+$/, '') })).filter((u)=>u.text);
}
const taskHeaders = () => TASK_HEADERS.concat(store.legacyCols || []);
function taskRow(t){
  return [t.id, t.name, t.status, t.created, t.updated, t.doneOn||'', t.tags.join(', '), t.assignees.join(', '),
    t.steps.map(stepLine).join('\n'),
    t.updates.map((u)=>(u.date ? u.date + ': ' : '') + u.text).join('\n'),
    t.links.map((l)=>(l.label ? l.label + ' ' : '') + l.url).join('\n'),
    t.costs.map((c)=>(c.amount===''||c.amount==null?'':(+c.amount).toFixed(2)+' ')+c.cur+(c.name?' '+c.name:'')).join('\n'),
    t.deleted||''].concat((store.legacyCols || []).map(()=>''));
}
const hasLegacy = (o) => LEGACY.some((k)=>String(o[k]==null?'':o[k]).trim());
function readTask(o){
  const g = (k) => o[k]==null ? '' : String(o[k]);
  const st = STATUSES.find((s)=>same(s, g('Status'))) || 'Todo';
  return {
    id:g('Id'), name:g('Name'), status:st, created:g('Created'), updated:g('Updated'), doneOn:g('Done on').slice(0,10),
    tags:list(g('Tags')), assignees:list(g('Assignees')),
    steps:readSteps(g('Next steps')).concat(readSteps(g('Checklist')).map((s)=>({ ...s, due:'' })), readSteps(g('Reminders'))),
    links:lines(g('Links')).map((l)=>{ const m = /(https?:\/\/\S+|www\.\S+)/i.exec(l);
      return m ? { label:(l.slice(0, m.index) + l.slice(m.index + m[0].length)).replace(/\s+/g, ' ').trim(), url:linkUrl(m[1]) } : { label:'', url:linkUrl(l) }; }),
    updates:readUpdates(g('Updates')).concat(g('Info').trim() ? [{ date:g('Updated').slice(0,10), text:g('Info').trim() }] : []),
    /* the currency before or after the amount, as a sign or a code */
    costs:lines(g('Costs')).map((l)=>{ const m = /^(€|\$)?\s*(-?[\d.,]+)?\s*(EUR|USD|€|\$)?\s*(.*)$/i.exec(l);
      const c = m[1] || m[3] || '', cur = c==='$' || /usd/i.test(c) ? 'USD' : 'EUR', v = num(m[2]);
      return { name:m[4]||'', amount: v==null ? '' : v, cur }; }),
    deleted:g('Deleted'),
  };
}
const filterText = (f) => [String(f.q||'').trim() ? 'Search: '+String(f.q).trim() : null,
  ...f.inc.map((e)=>'+ '+KIND_LABEL[e.kind]+': '+e.name), ...f.exc.map((e)=>'- '+KIND_LABEL[e.kind]+': '+e.name)].filter(Boolean).join('\n');
function readFilter(s){
  const f = blankFilter();
  for (const l of lines(s)) {
    let m = /^search:\s*(.*)$/i.exec(l); if (m) { f.q = m[1]; continue; }
    m = /^([+\-−])\s*(status|due|assignee|tag)s?:\s*(.+)$/i.exec(l); if (!m) continue;
    const kind = KINDS.find(([,lab])=>same(lab, m[2]))[0];
    const name = kind==='status' ? (STATUSES.find((s)=>same(s, m[3])) || null) : kind==='due' ? (DUES.concat([NONE]).find((s)=>same(s, m[3])) || null) : m[3].trim();
    if (name) (m[1]==='+' ? f.inc : f.exc).push({ kind, name });
  }
  return f;
}
const bmRow = (b) => [b.id, b.name, filterText(b.filter), SORT_LABEL[b.sort||'custom'], b.order.join(', '), b.updated, b.deleted||''];
const readBm = (o) => { const g = (k) => o[k]==null ? '' : String(o[k]);
  const sort = (SORTS.find(([k,lab])=>same(lab, g('Sort')) || same(k, g('Sort'))) || ['custom'])[0];
  return { id:g('Id'), name:g('Name') || (g('Id')==='all' ? 'All' : ''), filter:readFilter(g('Filter')), sort, order:list(g('Order')), updated:g('Updated'), deleted:g('Deleted') }; };
/* A tab as records: header names to cell values. */
const records = (tab) => { const h = ((tab && tab.headers) || []).map((x)=>String(x).trim());
  return ((tab && tab.rows) || []).map((r)=>{ const o = {}; h.forEach((k,i)=>{ o[k] = r[i]; }); return o; }).filter((o)=>o.Id); };
const TABS = { T:{ name:'Tasks', headers:taskHeaders, row:taskRow, read:readTask, key:'tasks' },
               B:{ name:'Bookmarks', headers:()=>BM_HEADERS, row:bmRow, read:readBm, key:'bookmarks' } };


/* ------------------------------------------------------------------- sync --
   Every edit marks its record; shortly after, the marked records go to the
   sheet, which merges them in and answers with every record. What comes back
   replaces what is here, except a record edited again while the answer was
   on its way. The sheet is read again whenever the app comes back to the
   screen, so what the rest of the family did shows. */
const connected = () => !!(store.backend.url && store.backend.token);
let syncTimer = null, syncing = null, again = false;
const markDirty = (k) => { if (!store.dirty.includes(k)) store.dirty.push(k); };
const recOf = (k) => store[TABS[k[0]].key].find((x)=>x.id===k.slice(2));
function syncSoon(){ if (!connected()) return; clearTimeout(syncTimer); syncTimer = setTimeout(()=>syncNow(true), 600); }
async function syncNow(quiet){
  if (!connected()) { state.sync = { msg:'Not connected.', bad:true }; render(); return; }
  if (syncing) { again = true; return syncing; }
  const sent = {};
  for (const k of store.dirty) { const r = recOf(k); if (r) sent[k] = r.updated; }
  const keys = Object.keys(sent);
  const tabs = Object.keys(TABS).map((p)=>{ const T = TABS[p], ids = keys.filter((k)=>k[0]===p).map((k)=>k.slice(2));
    return ids.length ? { name:T.name, headers:T.headers(), rows:store[T.key].filter((x)=>ids.includes(x.id)).map(T.row) } : null; }).filter(Boolean);
  if (!quiet) { state.sync = { msg:'Syncing…' }; render(); }
  syncing = (async () => {
    try {
      const j = await BK.sync(store.backend, tabs);
      /* what went up is no longer waiting - unless it changed again since */
      store.dirty = store.dirty.filter((k)=>!(k in sent) || (recOf(k)||{}).updated !== sent[k]);
      for (const p of Object.keys(TABS)) absorb(p, j.tabs || []);
      store.backendVersion = j.backend; store.syncedAt = NOW(); save();
      state.sync = { msg:'Synced ' + new Date().toTimeString().slice(0,5) + (keys.length ? ' · ' + keys.length + ' sent' : '') };
    } catch (e) { state.sync = { msg:e.message, bad:true }; }
  })();
  await syncing; syncing = null;
  render();
  if (again) { again = false; if (store.dirty.length) return syncNow(true); }
}
/* The sheet's records over this device's: one still waiting to go up stays
   as it is here; one that is not in the sheet and not waiting was removed
   from the sheet by hand, and goes. */
function absorb(p, tabs){
  const T = TABS[p], tab = tabs.find((t)=>t.name===T.name);
  if (!tab) return;
  /* the older columns the sheet still has: written back empty, and a row
     that still holds something in them goes up again, moved over */
  if (p==='T') store.legacyCols = LEGACY.filter((k)=>(tab.headers||[]).map((h)=>String(h).trim()).includes(k));
  let moved = 0;
  const waiting = new Set(store.dirty.filter((k)=>k[0]===p).map((k)=>k.slice(2)));
  const here = new Map(store[T.key].map((x)=>[x.id, x]));
  const out = [];
  for (const o of records(tab)) {
    const r = T.read(o), l = here.get(r.id);
    if (p==='T' && hasLegacy(o) && !waiting.has(r.id)) { markDirty('T:'+r.id); moved++; }
    out.push(l && waiting.has(l.id) && String(l.updated) > String(r.updated) ? l : r);
    here.delete(r.id);
  }
  for (const l of here.values()) if (waiting.has(l.id)) out.push(l);
  store[T.key] = out;
  if (moved) syncSoon();
}
/* A change: keep it, show it, send it. */
function commit(k, quiet){ markDirty(k); save(); if (!quiet) render(); syncSoon(); }

/* ---------------------------------------------------------------- helpers --*/
const esc = (s) => String(s==null?'':s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ICON_GEAR = '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>';
const bar = (p) => `<div class="bbar"><i class="${p.pct===100?'full':''}" style="width:${p.pct}%"></i></div>`;
const capOf = (name, x) => `<span class="cap"><span class="dot" style="background:${colorOf(name)}"></span>${esc(name)}${x||''}</span>`;

/* ------------------------------------------------------------- the list --*/
function filterMenu(f){
  const pickList = () => {
    const group = (label, kind, names, dot) => names.length ? `<div class="grp">${label}</div>` + names.map((n)=>
      `<button data-fadd="${state.fpick}|${kind}|${esc(n)}">${dot(n)}${esc(n)}</button>`).join('') : '';
    return `<div class="fpick">${group('Status', 'status', STATUSES, sdot)}${group('Due', 'due', DUES.concat([NONE]), ()=>'')}${group('Assignee', 'person', known('assignees').concat([NONE]), (n)=>n===NONE?'':`<span class="dot" style="background:${colorOf(n)}"></span>`)}${group('Tag', 'tag', known('tags').concat([NONE]), ()=>'')}</div>`;
  };
  return `
  <div class="fscrim" data-fopen="0"></div>
  <div class="fmenu">
    <div class="fsearch"><input id="fq" placeholder="Search…" value="${esc(f.q)}" autocapitalize="off"><span class="fx" data-fclear="q">×</span></div>
    <button class="ovf-addf" data-fpick="inc">+ Filter</button>
    <button class="ovf-exclf" data-fpick="exc">− Filter</button>
    ${state.fpick ? pickList() : ''}
    <button class="ovf-exclf" style="margin-top:4px;border-top:1px solid var(--line);border-radius:0 0 7px 7px" data-freset="1" ${filterOn(f)?'':'disabled'}>Clear filter</button>
  </div>`;
}
function filterChips(f){
  const chips = [];
  if (String(f.q||'').trim()) chips.push(['plain', 'q', '“'+esc(f.q.trim())+'”']);
  const lab = (e) => (e.kind==='status' ? sdot(e.name) : e.kind==='person' && e.name!==NONE ? `<span class="dot" style="background:${colorOf(e.name)}"></span>` : '')
    + (e.kind==='due' ? 'Due: ' : '') + esc(e.name);
  f.inc.forEach((e,i)=>chips.push(['', 'inc|'+i, lab(e)]));
  f.exc.forEach((e,i)=>chips.push(['exc', 'exc|'+i, '− '+lab(e)]));
  return chips.length ? `<div class="fchips">${chips.map(([cls,key,label])=>`<span class="fchip ${cls}">${label}<b data-funf="${key}">×</b></span>`).join('')}</div>` : '';
}
/* the bookmarks along the top: All, This week, then the rest as made */
const bmShown = () => [{ id:'all', name:'All' }].concat(bmLive().filter((x)=>x.id==='week'), bmLive().filter((x)=>x.id!=='all' && x.id!=='week'));
function screenTasks(){
  const f = curFilter(), b = activeBm(), ts = shownTasks(), sort = sortOf();
  const changed = b ? filterKey(f) !== filterKey(b.filter) : filterOn(f);
  const nextSort = SORTS[(SORTS.findIndex(([k])=>k===sort)+1) % SORTS.length][0];
  return `
  <div class="bmbar">${bmShown().map((x)=>`<button class="chip sm${orderKey()===x.id?' on':''}" data-bm="${esc(x.id)}">${esc(x.name)}</button>`).join('')}
    ${changed ? `<button class="chip sm add" data-bmnew="1">+ Bookmark</button>` : ''}
    ${changed && b ? `<button class="chip sm add" data-bmupd="1">Update ${esc(b.name)}</button>` : ''}</div>
  <div class="card">
    <h2><span class="ttl">${esc(b ? b.name : 'Tasks')}<span class="n">${ts.length}</span>${b ? `<button class="bmedit" data-bmedit="${esc(b.id)}" aria-label="Rename or delete this bookmark">✏️</button>` : ''}</span>
      <span class="hbtns"><button class="chip on sm" data-bmsort="${nextSort}">${esc(SORT_LABEL[sort])}</button>
        <span class="fdrop"><button class="fbtn ${filterOn(f)?'act':''}" data-fopen="${state.fopen?0:1}">🔍</button>${state.fopen?filterMenu(f):''}</span>
        <button class="gbtn" data-tnew="1" aria-label="New task">+</button></span></h2>
    ${filterChips(f)}
    <div class="tlist">${ts.map((t,i)=>{ const nd = sort==='due' ? nextDue(t) : '';
      return `
      <div class="trow${t.status==='Done'?' done':''}${state.dragIdx===i?' lift':''}" data-topen="${esc(t.id)}" data-trow="${i}">${sdot(t.status)}<span class="tn">${esc(t.name)}</span>${
        nd ? `<span class="when ${dueClass(nd)}">${esc(dLabel(nd))}</span>` : ''}${sort==='custom' ? `<span class="drag" data-tdrag="${i}">⠿</span>` : ''}</div>`; }).join('')
      || `<div class="empty">${live().length ? 'Nothing here.' : 'No tasks yet.'}</div>`}</div>
  </div>`;
}

/* --------------------------------------------------------- the task page --
   What a task is, as it reads. Here a step is ticked, the status changed and
   an update written (dated today); everything else is the editor's (✏️). */
const updatesHtml = (ups) => ups.map((u)=>`<div class="upd"><span class="when">${esc(u.date ? dLabel(u.date) : '')}</span><div class="info">${esc(u.text)}</div></div>`).join('');
function screenTask(){
  const t = store.tasks.find((x)=>x.id===state.view);
  if (!t || t.deleted) { state.view = null; return screenTasks(); }
  const p = progress(t), tot = costTotals(t.costs);
  return `
  <div class="page">
    <div class="ptitle"><h2>${esc(t.name)}</h2><button class="gbtn" data-tedit="${esc(t.id)}" aria-label="Edit">✏️</button></div>
    <button class="chip sm" data-vstat="1">${sdot(t.status)}${esc(t.status)}</button>
    ${state.statPick ? `<div class="spick">${STATUSES.filter((s)=>s!==t.status).map((s)=>`<button class="chip sm" data-vset="${esc(s)}">${sdot(s)}${esc(s)}</button>`).join('')}</div>` : ''}
    ${t.assignees.length ? `<div class="sec">Assignees</div><div class="caps">${t.assignees.map((a)=>capOf(a)).join('')}</div>` : ''}
    ${t.tags.length ? `<div class="sec">Tags</div><div class="caps">${t.tags.map((g)=>`<span class="cap">${esc(g)}</span>`).join('')}</div>` : ''}
    ${p.n ? `<div class="sec"><span>Next steps</span><span>${p.d}/${p.n}</span></div>${bar(p)}
      ${t.steps.map((s,i)=>`<div class="vli${s.done?' done':''}"><span class="ck${s.done?' on':''}" data-vck="${i}">${s.done?'✓':''}</span><span class="t">${esc(s.text)}</span>${
        s.due ? `<span class="when ${s.done?'':dueClass(s.due)}">${esc(dLabel(s.due))}</span>` : ''}</div>`).join('')}` : ''}
    ${t.links.length ? `<div class="sec">Links</div>${t.links.map((l)=>{ const u = safeUrl(l.url);
      return `<div class="vli">${u ? `<a class="lnk" href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(linkText(l))}</a>` : `<span class="t">${esc(linkText(l))}</span>`}</div>`; }).join('')}` : ''}
    <div class="sec">Updates</div>

      <button class="btn primary" data-vupd="1">Add</button></div>
    ${updatesHtml(t.updates)}
    ${t.costs.length ? `<div class="sec">Costs</div>${t.costs.map((c)=>`<div class="vli"><span class="t">${esc(c.name)}</span><span class="v">${num(c.amount)!=null?esc(money(num(c.amount), c.cur)):''}</span></div>`).join('')}
      <div class="tot">${Object.keys(tot).map((c)=>`<span>${esc(money(tot[c], c))}</span>`).join('')}</div>` : ''}
    <div class="stamp">Created ${esc(dLabel(t.created))} · Updated ${esc(dLabel(t.updated))}${t.doneOn?' · Done '+esc(dLabel(t.doneOn)):''}</div>
    <div class="closebar"><button class="btn close" data-vclose="1">Close</button></div>
  </div>`;
}
/* An update: what was typed, dated today, on top. */
function addUpdate(t, text){
  const v = String(text||'').replace(/\s+$/, '').replace(/^\s*\n/, '');
  if (!v.trim()) return false;
  t.updates.unshift({ date:TODAY(), text:v });
  return true;
}

/* ------------------------------------------------------- the task editor --
   Like Bench's: no Save. Everything typed is kept as it is typed; Close
   leaves. A new task comes into being with its first letter of name. */
const clone = (t) => JSON.parse(JSON.stringify(t));
function openEditor(id){
  const t = id ? store.tasks.find((x)=>x.id===id) : null;
  let d;
  if (t) d = clone(t);
  else { d = blank('Todo');
    /* a new task in a filtered list starts with what the list asks for */
    const f = curFilter(), st = f.inc.filter((e)=>e.kind==='status');
    if (st.length===1) d.status = st[0].name;
    for (const e of f.inc) if (e.name!==NONE) { if (e.kind==='tag') d.tags.push(e.name); if (e.kind==='person') d.assignees.push(e.name); } }
  state.edit = { id: t ? t.id : null, d:Object.assign(d, { tagIn:'', asgIn:'', stIn:'', upIn:'', lkIn:'' }), delArm:false, focus: t ? null : 'tName' };
  state.view = null; state.statPick = false;
  render();
}
/* The draft as it is stored: no empty lines, amounts as numbers. */
function cleaned(d){
  return {
    name:d.name.trim(), tags:d.tags.slice(), assignees:d.assignees.slice(),
    steps:d.steps.map((s)=>({ done:s.done, text:s.text.trim(), due:s.due||'' })).filter((s)=>s.text || s.due),
    updates:d.updates.map((u)=>({ date:u.date, text:u.text.replace(/\s+$/, '') })).filter((u)=>u.text.trim()),
    links:d.links.map((l)=>({ label:l.label.trim(), url:linkUrl(l.url) })).filter((l)=>l.url),
    costs:d.costs.map((c)=>{ const v = num(c.amount); return { name:c.name.trim(), amount: v==null ? '' : r2(v), cur:c.cur }; }).filter((c)=>c.name || c.amount!==''),
  };
}
/* Keep the draft: into the task (made now if it is new and has a name). */
function keepDraft(quiet){
  const e = state.edit; if (!e) return;
  const d = e.d, c = cleaned(d);
  let t = e.id ? store.tasks.find((x)=>x.id===e.id) : null;
  if (!t) { if (!c.name) return; t = Object.assign(blank(), { id:uid(), created:NOW() }); t.status = ''; store.tasks.push(t); e.id = t.id; }
  if (!c.name) c.name = t.name;            // an emptied name keeps the one it had
  const before = JSON.stringify(taskRow(t));
  Object.assign(t, c); setStatus(t, d.status);
  if (JSON.stringify(taskRow(t)) === before) return;
  t.updated = NOW();
  commit('T:'+t.id, quiet);
}
function boxField(label, field, inId, xAttr, addAttr){

      ${sugg.length?`<div class="sugg">${sugg.map((k)=>`<button class="chip sm add" data-${addAttr}="${esc(k)}">+ ${esc(k)}</button>`).join('')}</div>`:''}

}

      <div class="li"><input id="tLkIn" value="${esc(d.lkIn)}" placeholder="Paste a link" inputmode="url" autocapitalize="off" autocorrect="off" enterkeyhint="done"></div>

        <button class="chip on sm" data-pcocur="${i}|${c.cur==='EUR'?'USD':'EUR'}">${SYM[c.cur]}</button><span class="x" data-pcox="${i}">×</span></div>`).join('')}
      ${Object.keys(tot).length?`<div class="tot" style="padding-right:26px">${Object.keys(tot).map((c)=>`<span>${esc(money(tot[c], c))}</span>`).join('')}</div>`:''}

/* Whether the page runs as an installed app rather than a browser tab. */
const standalone = () => (typeof matchMedia==='function' && matchMedia('(display-mode: standalone)').matches)
  || (typeof navigator!=='undefined' && navigator.standalone===true);
let INSTALL_EVT = null;
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); INSTALL_EVT = e; render(); });

/* The app name in the top bar opens this: which version runs here, which
   one the sheet answers with, a hard reload and a sync. */
function aboutSheet(){
  const st = state.sync;
  return `
  <div class="sheetwrap">
    <div class="scrim" data-aboutclose="1"></div>
    <div class="sheet${state.about.fresh?' enter':''}">
      <h3>Slate<span style="color:var(--accent)">.</span></h3>
      <div class="rows">
        <div class="row"><span class="k">App</span><span class="v">v${esc(APP_VERSION)}</span></div>
        <div class="row"><span class="k">Backend</span><span class="v">${store.backendVersion?'v'+esc(store.backendVersion):'—'}</span></div>
        <div class="row"><span class="k">Synced</span><span class="v">${store.syncedAt ? esc(dLabel(store.syncedAt)) + ' ' + new Date(store.syncedAt).toTimeString().slice(0,5) : 'never'}</span></div>
      </div>
      <div class="btnrow" style="margin-top:10px">
        <button class="btn" data-reload="1">Hard reload</button>
        <button class="btn primary" data-bksync="1" ${connected()?'':'disabled'}>Sync</button>
      </div>

      ${st?`<div class="status ${st.bad?'bad':'ok'}">${esc(st.msg)}</div>`:''}
      <div class="foot"><button class="btn close" style="flex:1" data-aboutclose="1">Close</button></div>
    </div>
  </div>`;

/* ----------------------------------------------------------------- render --
   A page (a task, its editor) opens at its top; closing it brings the list
   back where it was. Every other redraw keeps its place. */
let lastWhere = null;
const where = () => state.tab + '|' + (state.view||'') + '|' + (state.edit ? 'e' : '');
function render(){
  const w = where(), moved = w !== lastWhere, wasList = lastWhere && lastWhere.startsWith('tasks||') && !lastWhere.endsWith('e');
  if (moved && wasList && typeof window.scrollY === 'number') state.listY = window.scrollY;
  lastWhere = w;
  document.getElementById('appTitle').innerHTML = `<span data-about="1">Slate<span class="dot">.</span></span>`;
  const sd = document.getElementById('syncDot');
  if (sd) sd.innerHTML = connected() && store.dirty.length ? `<span class="syncdot">${store.dirty.length} waiting</span>` : '';
  document.getElementById('setBtn').innerHTML =
    `<button class="hdrbtn${state.tab==='settings'?' on':''}" data-tab="${state.tab==='settings'?'tasks':'settings'}" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24">${ICON_GEAR}</svg></button>`;
  const tabs = document.getElementById('tabs');
  if (!moved && tabs.offsetHeight) tabs.style.minHeight = tabs.offsetHeight + 'px';
  const body = state.tab==='settings' ? screenSettings() : state.edit ? screenEdit() : state.view ? screenTask() : screenTasks();
  tabs.innerHTML = `<div class="tab">${state.about?aboutSheet():''}${state.bmEdit?bmSheet():''}${body}</div>`;
  wire();
  if (moved && typeof scrollTo==='function') scrollTo({ top: w==='tasks||' ? state.listY||0 : 0 });
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(()=>{ tabs.style.minHeight=''; });
  else tabs.style.minHeight='';
  const fo = state.edit ? state.edit.focus : state.focus;
  if (fo) { if (state.edit) state.edit.focus = null; state.focus = null;
    const f = document.getElementById(fo); if (f && f.focus) { f.focus(); try { const n = String(f.value||'').length; if (f.setSelectionRange) f.setSelectionRange(n, n); } catch (e) {} } }
}

/* Throw away the service worker and every cache, then reload from the
   network, so a fresh deploy is picked up on the spot. */
async function hardReload(){
  try {
    if (navigator.serviceWorker) for (const r of await navigator.serviceWorker.getRegistrations()) await r.unregister();
    if (typeof caches !== 'undefined') for (const k of await caches.keys()) await caches.delete(k);
  } catch (e) { /* nothing to clear */ }
  location.reload();
}

const on = (attr, f) => document.querySelectorAll('[data-'+attr+']').forEach((el)=>el.onclick=(e)=>{ if (e && e.stopPropagation) e.stopPropagation(); return f(el.dataset[attr], el, e); });
function wire(){
  on('reload', hardReload);
  on('about', ()=>{ state.about={ fresh:true }; state.sync=null; render(); state.about.fresh=false; });
  on('aboutclose', ()=>{ state.about=null; render(); });
  on('tab', (v)=>{ if (state.edit) keepDraft(true); state.tab=v; state.view=null; state.edit=null; state.about=null; state.fopen=false; render(); });
  on('install', async()=>{
    if (INSTALL_EVT) { INSTALL_EVT.prompt(); try { await INSTALL_EVT.userChoice; } catch (e) {} INSTALL_EVT=null; render(); return; }
    alert('Browser menu › Install app (or Add to Home Screen).'); });

  /* the list - unless a drag just happened, a row opens its page */
  on('topen', (id)=>{ if (state.dragged) { state.dragged = false; return; } state.view = id; state.updDraft = ''; state.statPick = false; state.fopen = false; render(); });
  on('tnew', ()=>{ state.fopen = false; openEditor(null); });
  on('tdrag', ()=>{});
  document.querySelectorAll('[data-tdrag]').forEach((el)=>{
    el.onpointerdown = (e) => {
      if (e && e.preventDefault) e.preventDefault(); if (e && e.stopPropagation) e.stopPropagation();
      state.dragIdx = +el.dataset.tdrag; state.dragMoved = false; render();
      const move = (ev) => {
        let to = state.dragIdx;
        document.querySelectorAll('[data-trow]').forEach((r)=>{ const b = r.getBoundingClientRect(); if (ev.clientY > b.top && ev.clientY < b.bottom) to = +r.dataset.trow; });
        if (to!==state.dragIdx && moveTask(state.dragIdx, to)) { state.dragIdx = to; state.dragMoved = true; render(); }
      };
      const up = () => { document.removeEventListener('pointermove', move); document.removeEventListener('pointerup', up); document.removeEventListener('pointercancel', up);
        const moved = state.dragMoved; state.dragIdx = null; state.dragMoved = false; state.dragged = moved;
        if (moved) commit('B:'+orderKey()); else render();
        setTimeout(()=>{ state.dragged = false; }, 0); };
      document.addEventListener('pointermove', move); document.addEventListener('pointerup', up); document.addEventListener('pointercancel', up);
    }; });

  /* the filter */
  const F = curFilter();
  on('fopen', (v)=>{ state.fopen = v==='1'; state.fpick = null; if (state.fopen) state.focus = 'fq'; render(); });
  on('fpick', (v)=>{ state.fpick = state.fpick===v ? null : v; render(); });
  on('fadd', (v)=>{ const [which, kind, ...rest] = v.split('|'), name = rest.join('|');
    const other = which==='inc' ? 'exc' : 'inc';
    F[other] = F[other].filter((e)=>!(e.kind===kind && same(e.name, name)));
    if (!F[which].some((e)=>e.kind===kind && same(e.name, name))) F[which].push({ kind, name });
    state.fpick = null; save(); render(); });
  on('funf', (v)=>{ if (v==='q') F.q = ''; else { const [w, i] = v.split('|'); F[w].splice(+i, 1); } save(); render(); });
  on('fclear', ()=>{ F.q = ''; state.focus = 'fq'; save(); render(); });
  on('freset', ()=>{ store.filter = blankFilter(); state.fopen = false; save(); render(); });
  const fq = document.getElementById('fq');
  if (fq) fq.oninput = () => { F.q = fq.value; save(); state.focus = 'fq'; render(); };

  /* bookmarks: a tap shows its list; a tap on the one showing opens it */
  /* a bookmark opens to rename or delete from the ✏️ by its title - or a tap on its chip when it is showing */
  const openBm = (id) => { const b = bmById(id); if (!b) return; state.fopen = false; state.bmEdit = { id, name:b.name, filter:b.filter, fresh:true }; render(); state.bmEdit.fresh = false; };
  on('bmedit', openBm);
  on('bm', (id)=>{
    if (id===orderKey() && id!=='all') { openBm(id); return; }
    store.bm = id; const b = bmById(id); store.filter = b && id!=='all' ? clone(b.filter) : blankFilter(); state.fopen = false; save(); render(); });
  on('bmnew', ()=>{ state.bmEdit = { id:null, name:'', filter:clone(curFilter()), fresh:true }; state.focus = 'bmName'; render(); state.bmEdit.fresh = false; });
  on('bmsort', (v)=>{ const b = ensureOrder(orderKey()); b.sort = v; b.updated = NOW(); commit('B:'+b.id); });
  on('bmupd', ()=>{ const b = activeBm(); if (!b) return; b.filter = clone(curFilter()); b.updated = NOW(); commit('B:'+b.id); });
  if (state.bmEdit) {
    const m = state.bmEdit, n = document.getElementById('bmName');
    if (n) n.oninput = () => { m.name = n.value; if (m.closeArm || m.delArm || m.msg) { m.closeArm = m.delArm = false; m.msg = null; render(); } };
    on('bmclose', ()=>{ const b = m.id ? bmById(m.id) : null;
      if (m.name.trim() !== (b ? b.name : '') && !m.closeArm) { m.closeArm = true; m.delArm = false; render(); return; }
      state.bmEdit = null; render(); });
    on('bmsave', ()=>{ const name = m.name.trim();
      if (!name) { m.msg = 'A name first.'; render(); return; }
      if (bmLive().some((x)=>x.id!==m.id && same(x.name, name))) { m.msg = 'There is one by that name.'; render(); return; }
      let b = m.id ? bmById(m.id) : null;
      if (!b) { b = newBm(uid('b'), name, clone(m.filter), sortOf());
        /* it starts in the order the list shows now */
        b.order = shownTasks().map((t)=>t.id); store.bookmarks.push(b); store.bm = b.id; }
      b.name = name; b.updated = NOW(); state.bmEdit = null; commit('B:'+b.id); });
    on('bmdel', ()=>{ if (!m.delArm) { m.delArm = true; m.closeArm = false; render(); return; }
      const b = bmById(m.id); state.bmEdit = null;
      if (b) { b.deleted = NOW(); b.updated = b.deleted; if (store.bm===b.id) { store.bm = 'all'; store.filter = blankFilter(); } commit('B:'+b.id); } else render(); });
  }

  /* the task page */
  const vt = state.view ? store.tasks.find((x)=>x.id===state.view) : null;
  if (vt) {
    on('vclose', ()=>{ state.view = null; state.statPick = false; state.updDraft = ''; render(); });
    on('tedit', (id)=>openEditor(id));
    on('vstat', ()=>{ state.statPick = !state.statPick; render(); });
    on('vset', (s)=>{ setStatus(vt, s); vt.updated = NOW(); state.statPick = false; commit('T:'+vt.id); });
    on('vck', (i)=>{ const s = vt.steps[+i]; if (!s) return; s.done = !s.done; vt.updated = NOW(); commit('T:'+vt.id); });
    const vu = document.getElementById('vUpd');
    if (vu) vu.oninput = () => { state.updDraft = vu.value; };
    on('vupd', ()=>{ if (!addUpdate(vt, state.updDraft)) return; state.updDraft = ''; vt.updated = NOW(); commit('T:'+vt.id); });
  }

  /* the editor: every change kept at once */
  const E = state.edit;
  if (E) {
    const d = E.d;
    const redraw = (focus) => { E.delArm = false; keepDraft(true); E.focus = focus || null; render(); };
    const field = (id, set) => { const el = document.getElementById(id);
      if (el) el.oninput = () => { set(el.value); const had = !!E.id; keepDraft(true); if (E.delArm || had !== !!E.id) { E.delArm = false; E.focus = id; render(); } }; return el; };
    field('tName', (v)=>{ d.name = v; });
    /* tags and assignees: Enter (or a comma) makes a capsule */
    const settleBox = (field_, inKey) => { for (const x of list(d[inKey])) if (!d[field_].some((h)=>same(h, x))) d[field_].push(x); d[inKey] = ''; };
    const box = (id, field_, inKey) => { const el = document.getElementById(id); if (!el) return;
      el.oninput = () => { d[inKey] = el.value; if (/,/.test(el.value)) { settleBox(field_, inKey); redraw(id); } };
      el.onkeydown = (e) => {
        if (e.key==='Enter') { if (e.preventDefault) e.preventDefault(); settleBox(field_, inKey); redraw(id); }
        else if (e.key==='Backspace' && !el.value && d[field_].length) { d[field_].pop(); redraw(id); } }; };
    box('tTagIn', 'tags', 'tagIn'); box('tAsgIn', 'assignees', 'asgIn');
    on('ptagx', (i)=>{ d.tags.splice(+i, 1); redraw(); });
    on('pasgx', (i)=>{ d.assignees.splice(+i, 1); redraw(); });
    on('ptagadd', (k)=>{ if (!d.tags.some((h)=>same(h, k))) d.tags.push(k); redraw(); });
    on('pasgadd', (k)=>{ if (!d.assignees.some((h)=>same(h, k))) d.assignees.push(k); redraw(); });
    on('pstat', (s)=>{ d.status = s; redraw(); });
    /* the next steps: Enter in the last line adds one, ready for the next;
       each can take a due date */
    d.steps.forEach((s, i) => { field('tSt'+i, (v)=>{ s.text = v; }); field('tSd'+i, (v)=>{ s.due = v; }); });
    const st = document.getElementById('tStIn');
    if (st) { st.oninput = () => { d.stIn = st.value; };
      st.onkeydown = (e) => { if (e.key!=='Enter') return; if (e.preventDefault) e.preventDefault();
        const v = (d.stIn||'').trim(); if (v) d.steps.push({ done:false, text:v, due:'' }); d.stIn = ''; redraw('tStIn'); }; }
    on('pckt', (i)=>{ const s = d.steps[+i]; if (s) s.done = !s.done; redraw(); });
    on('pckx', (i)=>{ d.steps.splice(+i, 1); redraw(); });
    /* updates: a new one dated today goes on top; the older ones edited in place */
    d.updates.forEach((u, i) => field('tUp'+i, (v)=>{ u.text = v; }));
    const up = document.getElementById('tUpIn');
    if (up) up.oninput = () => { d.upIn = up.value; };
    on('pupadd', ()=>{ if (addUpdate(d, d.upIn)) d.upIn = ''; redraw(); });
    on('pupx', (i)=>{ d.updates.splice(+i, 1); redraw(); });
    /* links: paste (or type) one and press Enter; a label can follow */
    d.links.forEach((l, i) => { field('tLkU'+i, (v)=>{ l.url = v; }); field('tLkL'+i, (v)=>{ l.label = v; }); });
    const lk = document.getElementById('tLkIn');
    if (lk) { lk.oninput = () => { d.lkIn = lk.value; };
      lk.onkeydown = (e) => { if (e.key!=='Enter') return; if (e.preventDefault) e.preventDefault();
        const v = (d.lkIn||'').trim(); if (v) d.links.push({ label:'', url:v }); d.lkIn = ''; redraw('tLkL'+(d.links.length-1)); }; }
    on('plkx', (i)=>{ d.links.splice(+i, 1); redraw(); });
    /* costs: the currency of the last line is the one a new line starts in */
    d.costs.forEach((c, i) => { field('tCoN'+i, (v)=>{ c.name = v; }); field('tCoA'+i, (v)=>{ c.amount = v; }); });
    on('pcoadd', ()=>{ const last = d.costs[d.costs.length-1]; d.costs.push({ name:'', amount:'', cur: last ? last.cur : 'EUR' }); redraw('tCoN'+(d.costs.length-1)); });
    on('pcocur', (v)=>{ const [i, c] = v.split('|'); if (d.costs[+i]) d.costs[+i].cur = c; redraw(); });
    on('pcox', (i)=>{ d.costs.splice(+i, 1); redraw(); });
    /* Close: what is half-typed counts; back to the task's page (or the
       list, when nothing was ever named) */
    on('eclose', ()=>{ settleBox('tags', 'tagIn'); settleBox('assignees', 'asgIn');
      const v = (d.stIn||'').trim(); if (v) d.steps.push({ done:false, text:v, due:'' }); d.stIn = '';
      if (addUpdate(d, d.upIn)) d.upIn = '';
      const lv = (d.lkIn||'').trim(); if (lv) d.links.push({ label:'', url:lv }); d.lkIn = '';
      keepDraft(true); state.view = E.id; state.edit = null; render(); });
    on('pdel', ()=>{ if (!E.delArm) { E.delArm = true; render(); return; }
      const t = store.tasks.find((x)=>x.id===E.id); state.edit = null; state.view = null;
      if (t) { t.deleted = NOW(); t.updated = t.deleted; commit('T:'+t.id); } else render(); });
  }

  /* settings */
  const u = document.getElementById('bkUrl'), k = document.getElementById('bkTok');
  if (u) u.oninput = () => { store.backend.url = u.value.trim(); save(); };
  if (k) k.oninput = () => { store.backend.token = k.value.trim(); save(); };
  on('bktest', async()=>{
    state.sync = { msg:'Testing…' }; render();
    try { const j = await BK.ping(store.backend); store.backendVersion = j.backend; save(); state.sync = { msg:'Connected · backend v' + j.backend }; }
    catch (e) { state.sync = { msg:e.message, bad:true }; }
    render(); });
  on('bksync', ()=>syncNow(false));
}

render();
/* Open: read the sheet (and send what waited). Back on screen: again. */
if (connected()) syncNow(true);
if (typeof document.addEventListener === 'function') document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && connected()) syncNow(true); });

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
