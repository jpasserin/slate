<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0f15">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Slate">
<title>Slate</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  /* Tally's tokens, unchanged, so the family of apps looks like one. */
  :root{
    --bg:#0d0f15; --bg2:#11131a; --card:#181b24; --card2:#1f2330; --line:#272b38;
    --txt:#eef1f7; --muted:#8a92a6; --accent:#3b82f6; --accent2:#7cb8ff;
    --good:#4ade80; --bad:#f87171; --warn:#fbbf24; --r:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;font-size:14px;}
  body{padding-top:env(safe-area-inset-top);padding-bottom:calc(24px + env(safe-area-inset-bottom));}
  .wrap{max-width:560px;margin:0 auto;padding:16px 16px 24px;}

  header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
    margin:0 -16px 14px;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line);}
  /* The name is a button: it opens the About widget. */
  header h1{font-size:20px;margin:0;letter-spacing:.3px;cursor:pointer;user-select:none;-webkit-user-select:none}
  header h1 .dot{color:var(--accent)}
  header .hdrright{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;font-weight:600}
  .syncdot{font-size:11px;font-weight:600;color:var(--muted)}
  .syncdot.bad{color:var(--bad)}
  .hdrbtn{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;width:28px;height:26px;
    cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0}
  .hdrbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .hdrbtn:active{color:var(--accent)}
  .hdrbtn.on{color:var(--accent);border-color:var(--accent)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px;}
  .card h2{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);
    margin:0 0 9px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .card.shut h2{margin-bottom:0}
  .card h2 .grp{display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none;-webkit-user-select:none;flex:1}
  .card h2 .n{color:var(--txt);font-variant-numeric:tabular-nums}
  .card h2 .chev{font-size:11px;transition:transform .15s;display:inline-block}
  .card.shut h2 .chev{transform:rotate(-90deg)}
  .hint{font-size:12px;color:var(--muted);line-height:1.5;margin-top:4px;}
  .muted{color:var(--muted)}

  /* A widget over the bottom half of the screen. */
  .sheetwrap{position:fixed;inset:0;z-index:40}
  .scrim{position:absolute;inset:0;background:rgba(0,0,0,.5)}
  .sheet{position:absolute;left:0;right:0;bottom:0;max-height:88vh;background:var(--card);
    border-top:1px solid var(--line);border-radius:20px 20px 0 0;padding:14px 16px calc(12px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:5px;overflow-y:auto;max-width:560px;margin:0 auto}
  /* Slides up once, when it opens; a redraw from a chip inside must not replay it. */
  .sheet.enter{animation:up .28s cubic-bezier(.2,.8,.2,1)}
  @keyframes up{from{transform:translateY(100%)}to{transform:none}}
  .sheet h3{margin:0 0 2px;font-size:16px}
  .sheet .shead{display:flex;align-items:center;gap:8px}
  .sheet .shead h3{flex:1;margin:0}
  .sheet .foot{display:flex;gap:8px;padding-top:4px;position:sticky;bottom:calc(-12px - env(safe-area-inset-bottom));background:var(--card);
    padding-bottom:calc(12px + env(safe-area-inset-bottom));margin-bottom:calc(-12px - env(safe-area-inset-bottom))}
  .sheet .foot .btn.close{flex:0 0 auto;min-width:92px;background:var(--bg2)}
  .sheet .foot .btn.close.arm{background:var(--bad);border-color:var(--bad);color:#fff}
  .sheet .stamp{font-size:11px;color:var(--muted);margin-top:2px}

  .field{margin-bottom:5px}
  .field>label,.field .lab{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:10.5px;color:var(--muted);
    margin-bottom:2px;text-transform:uppercase;letter-spacing:.5px}
  .field .lab .gbtn{height:20px;min-width:22px;font-size:13px}
  input,select,textarea{width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--txt);border-radius:10px;
    padding:5px 10px;font-size:14px;font-family:inherit;outline:none}
  textarea{resize:vertical;min-height:58px;line-height:1.4}
  input:focus,textarea:focus{border-color:var(--accent)}
  input[type=date]{color-scheme:dark}
  .btnrow{display:flex;gap:7px}
  .btn{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:11px;padding:8px 14px;
    font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;flex:1}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn:disabled{opacity:.45;cursor:default}
  .btn.danger{flex:0 0 auto;background:none;border-color:var(--bad);color:var(--bad)}
  .btn.danger.arm{background:var(--bad);color:#fff}
  .status{font-size:12.5px;margin-top:6px;font-weight:600}
  .status.ok{color:var(--good)} .status.bad{color:var(--bad)}

  .rows .row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
  .rows .row:last-child{border-bottom:0}
  .row .k{font-size:13.5px} .row .v{font-weight:700;font-variant-numeric:tabular-nums}

  /* Top-right group button: contour and the blue ground. */
  .gbtn{background:var(--accent);border:1px solid var(--accent);color:#fff;border-radius:8px;min-width:26px;height:24px;
    padding:0 7px;font-size:14px;font-weight:700;line-height:1;cursor:pointer;font-family:inherit;
    display:inline-flex;align-items:center;justify-content:center;text-transform:none;letter-spacing:0}

  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{background:var(--card2);border:1px solid var(--line);border-radius:18px;padding:4px 10px;color:var(--txt);
    font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .chip.sm{padding:2px 9px;font-size:11.5px}
  .chip.add{background:none;color:var(--muted);border-style:dashed}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
  .cap{font-size:11px;font-weight:600;border-radius:12px;padding:1px 8px;border:1px solid var(--line);color:var(--txt);background:var(--card2);
    display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .cap .x{opacity:.65;cursor:pointer;font-weight:700}
  .tagbox{display:flex;flex-wrap:wrap;gap:5px;align-items:center;background:var(--bg2);border:1px solid var(--line);
    border-radius:10px;padding:3px 8px;cursor:text;min-height:30px}
  .tagbox:focus-within{border-color:var(--accent)}
  .tagbox input{flex:1;min-width:90px;width:auto;background:none;border:0;padding:2px 2px}
  .sugg{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}

  /* A switch: a label with a sliding knob. */
  .switch{display:flex;align-items:center;gap:10px;margin-top:4px;cursor:pointer;font-size:13.5px}
    .switch .track{width:40px;height:22px;border-radius:11px;background:var(--line);position:relative;transition:background .15s;flex:none}
  .switch .track::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
  .switch .track.on{background:var(--accent)}
  .switch .track.on::after{left:20px}

  /* The progress bar: checklist items done over all of them. */
  .bbar{height:5px;background:var(--bg2);border-radius:4px;overflow:hidden;margin-top:6px}
  .bbar i{display:block;height:100%;border-radius:4px;background:var(--accent)}
  .bbar i.full{background:var(--good)}

  /* A tick box. */
  .ck{width:18px;height:18px;border:1.5px solid var(--muted);border-radius:5px;flex:none;display:inline-flex;align-items:center;
    justify-content:center;font-size:12px;color:#fff;cursor:pointer;font-weight:700}
  .ck.on{background:var(--accent);border-color:var(--accent)}

  /* A task in the list. */
  .trow{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .trow:last-child{border-bottom:0}
  .trow .tm{flex:1;min-width:0}
  .trow .tn{font-size:14px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
  .trow.done .tn{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
  .trow .ts{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-top:4px;font-size:11.5px;color:var(--muted)}
  .trow .ts .m{display:inline-flex;align-items:center;gap:3px;font-variant-numeric:tabular-nums}
  .trow .ts svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .trow .ts .due{color:var(--warn)}
  .trow .ts .late{color:var(--bad)}
  .trow .chip{flex:none;margin-top:1px}

  /* The widget's own lists: checklist, reminders, costs. */
  .li{display:flex;align-items:center;gap:6px;margin-bottom:4px}
  .li input{padding:4px 8px;font-size:13px;min-width:0}
  .li input.d{flex:0 0 132px}
  .li input.a{flex:0 0 84px;text-align:right}
  .li .x{color:var(--muted);cursor:pointer;font-size:17px;line-height:1;padding:0 2px;flex:none}
  .li.done input.t{color:var(--muted);text-decoration:line-through}
  .tot{display:flex;justify-content:flex-end;gap:12px;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;padding:2px 26px 0 0}
</style>
</head>
<body>
<div class="wrap">
  <header><h1 id="appTitle"></h1>
    <div class="hdrright"><span id="syncDot"></span><span id="setBtn"></span></div></header>
  <div id="tabs"></div>
</div>

<script src="backend.js?v=1"></script>
<script>
const APP_VERSION="1";
const BK = window.SlateBackend;

/* ------------------------------------------------------------------ store --
   Everything this device remembers, in one localStorage key. */
const KEY = 'slate-v1';
function loadStore(){ try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
const store = Object.assign({ backend:{ url:'', token:'' }, backendVersion:null, tasks:[], dirty:[], syncedAt:null, shut:{ Done:true } }, loadStore());
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) { /* private mode */ } };
const state = { tab:'tasks', page:null, about:null, sync:null };

/* ------------------------------------------------------------- the model --
   A task: a name, a status, the day it was made and the moment it last
   changed, a checklist (its progress), reminders (a date and what to do),
   tags, assignees, a cost list in euros or dollars, a note, and whether it
   is one for this week. A deleted task keeps its row, Deleted filled, so a
   phone that still has it cannot bring it back. */
const STATUSES = ['Backlog','Todo','In progress','Done'];
/* The list shows what is moving first. */
const SHOWN = ['In progress','Todo','Backlog','Done'];
const nextStatus = (s) => STATUSES[(STATUSES.indexOf(s)+1) % STATUSES.length];
const CURS = ['EUR','USD'];
const SYM = { EUR:'€', USD:'$' };
const NOW = () => new Date().toISOString();
const TODAY = () => { const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const uid = () => 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const live = () => store.tasks.filter((t)=>!t.deleted);
const blank = (status) => ({ id:'', name:'', status:status||'Todo', created:'', updated:'', doneOn:'', info:'',
  checklist:[], reminders:[], tags:[], assignees:[], costs:[], week:false, deleted:'' });
const progress = (t) => { const n = t.checklist.length, d = t.checklist.filter((i)=>i.done).length; return { n, d, pct: n ? Math.round(d*100/n) : 0 }; };
const r2 = (x) => Math.round(x*100)/100;
/* an amount as typed: a comma is a decimal point too */
const num = (a) => { const s = String(a==null?'':a).replace(',', '.').trim(); return s==='' || !isFinite(+s) ? null : +s; };
const costTotals = (costs) => { const out = {}; for (const c of costs) { const v = num(c.amount); if (v!=null) out[c.cur] = r2((out[c.cur]||0) + v); } return out; };
const money = (v, cur) => (v<0?'-':'') + SYM[cur] + Math.abs(v).toLocaleString('en-US', { minimumFractionDigits:2, maximumFractionDigits:2 });
/* The reminder that comes next: the earliest one not ticked off. */
const nextReminder = (t) => t.reminders.filter((r)=>!r.done && r.date).sort((a,b)=>a.date<b.date?-1:1)[0] || null;
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dLabel = (d) => { if (!d) return ''; const s = String(d).slice(0,10); const [y,m,dd] = s.split('-');
  return (+dd) + ' ' + MON[+m-1] + (y===TODAY().slice(0,4) ? '' : ' ' + y); };
/* Known tags and people: everything any task carries, most used first. */
const known = (field) => { const n = {}; for (const t of live()) for (const x of t[field]) n[x] = (n[x]||0) + 1;
  return Object.keys(n).sort((a,b)=>n[b]-n[a] || a.localeCompare(b)); };
const same = (a, b) => String(a).trim().toLowerCase() === String(b).trim().toLowerCase();
/* One colour per name, the same on every phone. */
const PALETTE = ['#3b82f6','#4ade80','#fbbf24','#f87171','#a78bfa','#22d3ee','#fb923c','#f472b6'];
const colorOf = (s) => { let h = 0; for (const c of String(s).toLowerCase()) h = (h*31 + c.charCodeAt(0)) >>> 0; return PALETTE[h % PALETTE.length]; };

/* ------------------------------------------------------- the sheet's rows --
   One row per task in the Tasks tab. The lists sit in one cell each, one
   line per item, written so they read well in the sheet and can be typed
   there by hand:
     Checklist   [x] buy paint          Reminders   [ ] 2026-11-12 call the plumber
     Costs       45.90 EUR Paint        Tags, Assignees   comma-separated   */
const TASK_HEADERS = ['Id','Name','Status','Created','Updated','Done on','Tags','Assignees','Checklist','Reminders','Costs','Info','This week','Deleted'];
const lines = (s) => String(s==null?'':s).split(/\r?\n/).map((x)=>x.trim()).filter(Boolean);
const list = (s) => String(s==null?'':s).split(',').map((x)=>x.trim()).filter(Boolean);
function taskRow(t){
  return [t.id, t.name, t.status, t.created, t.updated, t.doneOn||'', t.tags.join(', '), t.assignees.join(', '),
    t.checklist.map((i)=>(i.done?'[x] ':'[ ] ')+i.text).join('\n'),
    t.reminders.map((r)=>(r.done?'[x] ':'[ ] ')+r.date+(r.text?' '+r.text:'')).join('\n'),
    t.costs.map((c)=>(c.amount===''||c.amount==null?'':(+c.amount).toFixed(2)+' ')+c.cur+(c.name?' '+c.name:'')).join('\n'),
    t.info||'', t.week?'yes':'', t.deleted||''];
}
function readTask(o){
  const g = (k) => o[k]==null ? '' : String(o[k]);
  const st = STATUSES.find((s)=>same(s, g('Status'))) || 'Todo';
  return {
    id:g('Id'), name:g('Name'), status:st, created:g('Created'), updated:g('Updated'), doneOn:g('Done on').slice(0,10),
    info:g('Info'), tags:list(g('Tags')), assignees:list(g('Assignees')),
    checklist:lines(g('Checklist')).map((l)=>{ const m = /^\[([ xX])\]\s?(.*)$/.exec(l); return m ? { done:m[1]!==' ', text:m[2] } : { done:false, text:l }; }),
    reminders:lines(g('Reminders')).map((l)=>{ const m = /^(?:\[([ xX])\]\s*)?(\d{4}-\d{2}-\d{2})?\s*(.*)$/.exec(l); return { done:!!(m[1] && m[1]!==' '), date:m[2]||'', text:m[3]||'' }; }),
    /* the currency before or after the amount, as a sign or a code */
    costs:lines(g('Costs')).map((l)=>{ const m = /^(€|\$)?\s*(-?[\d.,]+)?\s*(EUR|USD|€|\$)?\s*(.*)$/i.exec(l);
      const c = m[1] || m[3] || '', cur = c==='$' || /usd/i.test(c) ? 'USD' : 'EUR', v = num(m[2]);
      return { name:m[4]||'', amount: v==null ? '' : v, cur }; }),
    week:/^(yes|true|x|1)$/i.test(g('This week').trim()), deleted:g('Deleted'),
  };
}
/* A tab as records: header names to cell values. */
const records = (tab) => { const h = ((tab && tab.headers) || []).map((x)=>String(x).trim());
  return ((tab && tab.rows) || []).map((r)=>{ const o = {}; h.forEach((k,i)=>{ o[k] = r[i]; }); return o; }).filter((o)=>o.Id); };
const tasksTab = (ids) => ({ name:'Tasks', headers:TASK_HEADERS, rows:store.tasks.filter((t)=>!ids || ids.includes(t.id)).map(taskRow) });

/* ------------------------------------------------------------------- sync --
   Every edit marks its task; shortly after, the marked tasks go to the sheet,
   which merges them in and answers with every task. What comes back replaces
   what is here, except a task edited again while the answer was on its way.
   The sheet is read again whenever the app comes back to the screen, so what
   the rest of the family did shows. */
const connected = () => !!(store.backend.url && store.backend.token);
let syncTimer = null, syncing = null, again = false;
const markDirty = (id) => { if (!store.dirty.includes(id)) store.dirty.push(id); };
function syncSoon(){ if (!connected()) return; clearTimeout(syncTimer); syncTimer = setTimeout(()=>syncNow(true), 600); }
async function syncNow(quiet){
  if (!connected()) { state.sync = { msg:'Not connected.', bad:true }; render(); return; }
  if (syncing) { again = true; return syncing; }
  const sent = {};
  for (const id of store.dirty) { const t = store.tasks.find((x)=>x.id===id); if (t) sent[id] = t.updated; }
  const ids = Object.keys(sent);
  if (!quiet) { state.sync = { msg:'Syncing…' }; render(); }
  syncing = (async () => {
    try {
      const j = await BK.sync(store.backend, ids.length ? [tasksTab(ids)] : []);
      /* what went up is no longer waiting - unless it changed again since */
      store.dirty = store.dirty.filter((id)=>!(id in sent) || (store.tasks.find((x)=>x.id===id)||{}).updated !== sent[id]);
      absorb(j.tabs || []);
      store.backendVersion = j.backend; store.syncedAt = NOW(); save();
      state.sync = { msg:'Synced ' + new Date().toTimeString().slice(0,5) + (ids.length ? ' · ' + ids.length + ' sent' : '') };
    } catch (e) { state.sync = { msg:e.message, bad:true }; }
  })();
  await syncing; syncing = null;
  render();
  if (again) { again = false; if (store.dirty.length) return syncNow(true); }
}
/* The sheet's tasks over this device's: a task still waiting to go up stays
   as it is here; one that is not in the sheet and not waiting was removed
   from the sheet by hand, and goes. */
function absorb(tabs){
  const tab = tabs.find((t)=>t.name==='Tasks');
  if (!tab) return;
  const waiting = new Set(store.dirty);
  const here = new Map(store.tasks.map((t)=>[t.id, t]));
  const out = [];
  for (const o of records(tab)) {
    const r = readTask(o), l = here.get(r.id);
    out.push(l && waiting.has(l.id) && String(l.updated) > String(r.updated) ? l : r);
    here.delete(r.id);
  }
  for (const l of here.values()) if (waiting.has(l.id)) out.push(l);
  store.tasks = out;
}
/* A change: keep it, show it, send it. */
function commit(t){ markDirty(t.id); save(); render(); syncSoon(); }

/* ---------------------------------------------------------------- helpers --*/
const esc = (s) => String(s==null?'':s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ICON_GEAR = '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>';
const ICON_CHECK = '<path d="M4 12l5 5L20 6"/>';
const ICON_BELL = '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/>';
const ICON_COST = '<path d="M12 2v20"/><path d="M17 6H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>';
const ICON_INFO = '<path d="M4 6h16M4 12h16M4 18h10"/>';
const bar = (p) => `<div class="bbar"><i class="${p.pct===100?'full':''}" style="width:${p.pct}%"></i></div>`;
const capOf = (name, x) => `<span class="cap"><span class="dot" style="background:${colorOf(name)}"></span>${esc(name)}${x||''}</span>`;

/* ------------------------------------------------------------------ tasks --*/
function taskLine(t){
  const p = progress(t), nr = nextReminder(t), tot = costTotals(t.costs);
  const meta = [];
  for (const a of t.assignees) meta.push(capOf(a));
  for (const g of t.tags) meta.push(`<span class="cap">${esc(g)}</span>`);
  if (p.n) meta.push(`<span class="m"><svg viewBox="0 0 24 24">${ICON_CHECK}</svg>${p.d}/${p.n}</span>`);
  if (nr) meta.push(`<span class="m ${nr.date < TODAY() ? 'late' : nr.date <= weekEnd() ? 'due' : ''}"><svg viewBox="0 0 24 24">${ICON_BELL}</svg>${esc(dLabel(nr.date))}</span>`);
  for (const c of Object.keys(tot)) meta.push(`<span class="m">${esc(money(tot[c], c))}</span>`);
  if (t.info) meta.push(`<span class="m"><svg viewBox="0 0 24 24">${ICON_INFO}</svg></span>`);
  return `
    <div class="trow${t.status==='Done'?' done':''}" data-topen="${esc(t.id)}">
      <div class="tm"><div class="tn">${esc(t.name)}</div>
        ${meta.length?`<div class="ts">${meta.join('')}</div>`:''}
        ${p.n?bar(p):''}</div>
      <button class="chip on sm" data-tstat="${esc(t.id)}|${esc(nextStatus(t.status))}">${esc(t.status)}</button>
    </div>`;
}
/* Sunday of this week: a reminder up to it is due. */
const weekEnd = () => { const d = new Date(); d.setDate(d.getDate() + (7 - (d.getDay() || 7))); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
/* Newest first; Done by the day it was done. */
const ordered = (status) => live().filter((t)=>t.status===status)
  .sort((a,b)=> status==='Done' ? (String(b.doneOn).localeCompare(String(a.doneOn)) || String(b.updated).localeCompare(String(a.updated))) : String(b.created).localeCompare(String(a.created)));
function screenTasks(){
  return SHOWN.map((s)=>{ const ts = ordered(s), shut = !!store.shut[s];
    return `
    <div class="card${shut?' shut':''}">
      <h2><span class="grp" data-grp="${esc(s)}"><span class="chev">▾</span>${esc(s)} <span class="n">${ts.length}</span></span>
        <button class="gbtn" data-tnew="${esc(s)}" aria-label="New task in ${esc(s)}">+</button></h2>
      ${shut ? '' : ts.map(taskLine).join('')}
    </div>`; }).join('');
}

/* ---------------------------------------------------------- the widget ----
   One for a new task and an existing one. Everything typed goes straight
   into the draft; Save writes it, Close drops it (red "Close?" first when
   there is something to lose). */
const clone = (t) => JSON.parse(JSON.stringify(t));
const draftKey = (d) => JSON.stringify([d.name, d.status, d.info, d.week, d.tags, d.assignees, d.checklist, d.reminders,
  d.costs.map((c)=>[c.name, String(c.amount), c.cur]), d.tagIn, d.asgIn, d.ckIn]);
function openTask(id, status){
  const t = id ? store.tasks.find((x)=>x.id===id) : null;
  const d = Object.assign(clone(t || blank(status)), { tagIn:'', asgIn:'', ckIn:'' });
  state.page = { d, was:draftKey(d), fresh:true, closeArm:false, delArm:false, msg:null, focus:null };
  render(); state.page.fresh = false;
}
const isDirty = () => state.page && draftKey(state.page.d) !== state.page.was;
function boxField(label, field, inId, xAttr, addAttr){
  const d = state.page.d, have = d[field];
  const sugg = known(field).filter((k)=>!have.some((h)=>same(h, k))).slice(0, 10);
  return `
    <div class="field"><label>${label}</label>
      <div class="tagbox">${have.map((x,i)=> field==='assignees' ? capOf(x, `<span class="x" data-${xAttr}="${i}">×</span>`)
        : `<span class="cap">${esc(x)}<span class="x" data-${xAttr}="${i}">×</span></span>`).join('')}
        <input id="${inId}" value="${esc(d[field==='tags'?'tagIn':'asgIn'])}" autocapitalize="off" enterkeyhint="done"></div>
      ${sugg.length?`<div class="sugg">${sugg.map((k)=>`<button class="chip sm add" data-${addAttr}="${esc(k)}">+ ${esc(k)}</button>`).join('')}</div>`:''}
    </div>`;
}
function taskSheet(){
  const p = state.page, d = p.d, pr = progress(d), tot = costTotals(d.costs);
  return `
  <div class="sheetwrap">
    <div class="scrim" data-tclose="1"></div>
    <div class="sheet${p.fresh?' enter':''}">
      <div class="shead"><h3>${d.id?'Task':'New task'}</h3>
        <button class="chip on sm" data-pstat="${esc(nextStatus(d.status))}">${esc(d.status)}</button></div>
      <div class="field"><label>Name</label><input id="tName" value="${esc(d.name)}"></div>
      ${boxField('Tags', 'tags', 'tTagIn', 'ptagx', 'ptagadd')}
      ${boxField('Assignees', 'assignees', 'tAsgIn', 'pasgx', 'pasgadd')}
      <div class="field"><div class="lab"><span>Checklist${pr.n?' · '+pr.d+'/'+pr.n:''}</span></div>
        ${pr.n?`<div style="margin:0 0 6px">${bar(pr)}</div>`:''}
        ${d.checklist.map((it,i)=>`
        <div class="li${it.done?' done':''}"><span class="ck${it.done?' on':''}" data-pckt="${i}">${it.done?'✓':''}</span>
          <input class="t" id="tCk${i}" value="${esc(it.text)}"><span class="x" data-pckx="${i}">×</span></div>`).join('')}
        <div class="li"><span class="ck" style="opacity:.35"></span><input id="tCkIn" value="${esc(d.ckIn)}" placeholder="Add an item" enterkeyhint="done"></div>
      </div>
      <div class="field"><div class="lab"><span>Reminders</span><button class="gbtn" data-prmadd="1">+</button></div>
        ${d.reminders.map((r,i)=>`
        <div class="li${r.done?' done':''}"><span class="ck${r.done?' on':''}" data-prmt="${i}">${r.done?'✓':''}</span>
          <input class="d" type="date" id="tRmD${i}" value="${esc(r.date)}"><input class="t" id="tRmT${i}" value="${esc(r.text)}"><span class="x" data-prmx="${i}">×</span></div>`).join('')}
      </div>
      <div class="field"><div class="lab"><span>Costs</span><button class="gbtn" data-pcoadd="1">+</button></div>
        ${d.costs.map((c,i)=>`
        <div class="li"><input class="t" id="tCoN${i}" value="${esc(c.name)}"><input class="a" id="tCoA${i}" value="${esc(c.amount)}" inputmode="decimal">
          <button class="chip on sm" data-pcocur="${i}|${c.cur==='EUR'?'USD':'EUR'}">${SYM[c.cur]}</button><span class="x" data-pcox="${i}">×</span></div>`).join('')}
        ${Object.keys(tot).length?`<div class="tot">${Object.keys(tot).map((c)=>`<span>${esc(money(tot[c], c))}</span>`).join('')}</div>`:''}
      </div>
      <div class="field"><label>Infos</label><textarea id="tInfo">${esc(d.info)}</textarea></div>
      <div class="switch" data-pweek="1"><span class="track${d.week?' on':''}"></span><span>This week</span></div>
      ${d.id?`<div class="stamp">Created ${esc(dLabel(d.created))} · Updated ${esc(dLabel(d.updated))}${d.doneOn?' · Done '+esc(dLabel(d.doneOn)):''}</div>`:''}
      ${p.msg?`<div class="status bad">${esc(p.msg)}</div>`:''}
      <div class="foot">
        ${d.id?`<button class="btn danger${p.delArm?' arm':''}" data-pdel="1">${p.delArm?'Delete?':'Delete'}</button>`:''}
        <button class="btn close${p.closeArm?' arm':''}" data-tclose="1">${p.closeArm?'Close?':'Close'}</button>
        <button class="btn primary" data-psave="1">Save</button>
      </div>
    </div>
  </div>`;
}
/* What is half-typed when Save is pressed still counts. */
function settle(d){
  const add = (field, inKey) => { for (const x of list(d[inKey])) if (!d[field].some((h)=>same(h, x))) d[field].push(x); d[inKey] = ''; };
  add('tags', 'tagIn'); add('assignees', 'asgIn');
  if (d.ckIn.trim()) d.checklist.push({ done:false, text:d.ckIn.trim() }); d.ckIn = '';
  d.checklist = d.checklist.map((i)=>({ done:i.done, text:i.text.trim() })).filter((i)=>i.text);
  d.reminders = d.reminders.map((r)=>({ done:r.done, date:r.date, text:r.text.trim() })).filter((r)=>r.date || r.text);
  d.costs = d.costs.map((c)=>{ const v = num(c.amount);
    return { name:c.name.trim(), amount: v==null ? '' : r2(v), cur:c.cur }; }).filter((c)=>c.name || c.amount!=='');
}
/* The status a task moves to, and the day it was done with it. */
function setStatus(t, s){ if (s==='Done' && t.status!=='Done') t.doneOn = TODAY(); if (s!=='Done') t.doneOn = ''; t.status = s; }
function saveTask(){
  const p = state.page, d = p.d;
  settle(d);
  d.name = d.name.trim();
  if (!d.name) { p.msg = 'A name first.'; p.closeArm = false; p.delArm = false; render(); return; }
  if (d.reminders.some((r)=>!r.date)) { p.msg = 'A reminder needs a date.'; render(); return; }
  const now = NOW();
  let t = d.id ? store.tasks.find((x)=>x.id===d.id) : null;
  const was = t ? t.status : null;
  const { tagIn, asgIn, ckIn, ...clean } = d;
  if (!t) { t = Object.assign(blank(), clean, { id:uid(), created:now }); store.tasks.push(t); }
  else Object.assign(t, clean);
  t.status = was || ''; setStatus(t, d.status);
  if (was === 'Done' && d.status === 'Done') t.doneOn = t.doneOn || TODAY();
  t.updated = now;
  state.page = null;
  commit(t);
}

/* --------------------------------------------------------------- settings --*/
function screenSettings(){
  const b = store.backend, st = state.sync;
  return `
  <div class="card">
    <h2>Spreadsheet</h2>
    <div class="field"><label>Script url</label>
      <input id="bkUrl" value="${esc(b.url)}" placeholder="https://script.google.com/macros/s/…/exec" autocapitalize="off" autocorrect="off"></div>
    <div class="field"><label>Token</label>
      <input id="bkTok" value="${esc(b.token)}" type="password" autocapitalize="off"></div>
    <div class="btnrow">
      <button class="btn" data-bktest="1">Test</button>
      <button class="btn primary" data-bksync="1" ${connected()?'':'disabled'}>Sync</button>
    </div>
    ${st?`<div class="status ${st.bad?'bad':'ok'}">${esc(st.msg)}</div>`:''}
    ${store.dirty.length?`<div class="status bad">${store.dirty.length} task${store.dirty.length===1?'':'s'} waiting</div>`:''}
  </div>`;
}

/* Whether the page runs as an installed app rather than a browser tab. */
const standalone = () => (typeof matchMedia==='function' && matchMedia('(display-mode: standalone)').matches)
  || (typeof navigator!=='undefined' && navigator.standalone===true);
let INSTALL_EVT = null;
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); INSTALL_EVT = e; render(); });

/* The app name in the top bar opens this: which version runs here, which
   one the sheet answers with, a hard reload and a sync. */
function aboutSheet(){
  const st = state.sync;
  return `
  <div class="sheetwrap">
    <div class="scrim" data-aboutclose="1"></div>
    <div class="sheet${state.about.fresh?' enter':''}">
      <h3>Slate<span class="dot" style="color:var(--accent);background:none;width:auto;height:auto">.</span></h3>
      <div class="rows">
        <div class="row"><span class="k">App</span><span class="v">v${esc(APP_VERSION)}</span></div>
        <div class="row"><span class="k">Backend</span><span class="v">${store.backendVersion?'v'+esc(store.backendVersion):'—'}</span></div>
        <div class="row"><span class="k">Synced</span><span class="v">${store.syncedAt ? esc(dLabel(store.syncedAt)) + ' ' + new Date(store.syncedAt).toTimeString().slice(0,5) : 'never'}</span></div>
      </div>
      <div class="btnrow" style="margin-top:10px">
        <button class="btn" data-reload="1">Hard reload</button>
        <button class="btn primary" data-bksync="1" ${connected()?'':'disabled'}>Sync</button>
      </div>
      ${standalone() ? '' : `<button class="btn primary" style="width:100%;margin-top:8px" data-install="1">Install on this phone</button>`}
      ${st?`<div class="status ${st.bad?'bad':'ok'}">${esc(st.msg)}</div>`:''}
      <div class="foot"><button class="btn close" style="flex:1" data-aboutclose="1">Close</button></div>
    </div>
  </div>`;
}

/* ----------------------------------------------------------------- render --
   The page scrolls to the top only when the page changes; every other redraw
   keeps its place - the content area holds its height while it is swapped. */
const SCREENS = { tasks:screenTasks, settings:screenSettings };
let lastTab = null;
function render(){
  const moved = state.tab !== lastTab; lastTab = state.tab;
  document.getElementById('appTitle').innerHTML = `<span data-about="1">Slate<span class="dot">.</span></span>`;
  const sd = document.getElementById('syncDot');
  if (sd) sd.innerHTML = connected() && store.dirty.length ? `<span class="syncdot${state.sync&&state.sync.bad?' bad':''}">${store.dirty.length} waiting</span>` : '';
  document.getElementById('setBtn').innerHTML =
    `<button class="hdrbtn${state.tab==='settings'?' on':''}" data-tab="${state.tab==='settings'?'tasks':'settings'}" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24">${ICON_GEAR}</svg></button>`;
  const tabs = document.getElementById('tabs');
  if (!moved && tabs.offsetHeight) tabs.style.minHeight = tabs.offsetHeight + 'px';
  /* a widget redrawn from inside keeps its own scroll too */
  const old = typeof document.querySelector==='function' ? document.querySelector('.sheet') : null, keep = old ? old.scrollTop : 0;
  tabs.innerHTML = `<div class="tab">${state.about?aboutSheet():''}${state.page?taskSheet():''}${SCREENS[state.tab]()}</div>`;
  if (keep) { const nw = document.querySelector('.sheet'); if (nw) nw.scrollTop = keep; }
  wire();
  if (moved && typeof scrollTo==='function') scrollTo({ top:0 });
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(()=>{ tabs.style.minHeight=''; });
  else tabs.style.minHeight='';
  if (state.page && state.page.focus) { const f = document.getElementById(state.page.focus); state.page.focus = null; if (f && f.focus) f.focus(); }
}

/* Throw away the service worker and every cache, then reload from the
   network, so a fresh deploy is picked up on the spot. */
async function hardReload(){
  try {
    if (navigator.serviceWorker) for (const r of await navigator.serviceWorker.getRegistrations()) await r.unregister();
    if (typeof caches !== 'undefined') for (const k of await caches.keys()) await caches.delete(k);
  } catch (e) { /* nothing to clear */ }
  location.reload();
}

const on = (attr, f) => document.querySelectorAll('[data-'+attr+']').forEach((el)=>el.onclick=(e)=>{ if (e && e.stopPropagation) e.stopPropagation(); return f(el.dataset[attr.replace(/-(.)/g,(m,c)=>c.toUpperCase())], el, e); });
function wire(){
  on('reload', hardReload);
  on('about', ()=>{ state.about={ fresh:true }; state.sync=null; render(); state.about.fresh=false; });
  on('aboutclose', ()=>{ state.about=null; render(); });
  on('tab', (v)=>{ state.tab=v; state.page=null; state.about=null; render(); });
  on('install', async()=>{
    if (INSTALL_EVT) { INSTALL_EVT.prompt(); try { await INSTALL_EVT.userChoice; } catch (e) {} INSTALL_EVT=null; render(); return; }
    alert('Browser menu › Install app (or Add to Home Screen).'); });

  /* the list */
  on('grp', (s)=>{ store.shut[s] = !store.shut[s]; save(); render(); });
  on('tnew', (s)=>openTask(null, s));
  on('topen', (id)=>openTask(id));
  on('tstat', (v)=>{ const i = v.lastIndexOf('|'), t = store.tasks.find((x)=>x.id===v.slice(0,i)); if (!t) return;
    setStatus(t, v.slice(i+1)); t.updated = NOW(); commit(t); });

  /* the widget */
  const p = state.page;
  if (p) {
    const d = p.d;
    const calm = () => { p.closeArm = false; p.delArm = false; p.msg = null; };
    const redraw = (focus) => { calm(); p.focus = focus || null; render(); };
    const field = (id, set) => { const el = document.getElementById(id); if (el) el.oninput = () => { set(el.value); if (p.closeArm || p.delArm) redraw(); }; return el; };
    field('tName', (v)=>{ d.name = v; });
    field('tInfo', (v)=>{ d.info = v; });
    /* tags and assignees: Enter (or a comma) makes a capsule */
    const box = (id, field_, inKey) => { const el = field(id, (v)=>{ d[inKey] = v; if (/,/.test(v)) { settleBox(field_, inKey); redraw(id); } });
      if (el) el.onkeydown = (e) => {
        if (e.key==='Enter') { if (e.preventDefault) e.preventDefault(); settleBox(field_, inKey); redraw(id); }
        else if (e.key==='Backspace' && !el.value && d[field_].length) { d[field_].pop(); redraw(id); } }; };
    const settleBox = (field_, inKey) => { for (const x of list(d[inKey])) if (!d[field_].some((h)=>same(h, x))) d[field_].push(x); d[inKey] = ''; };
    box('tTagIn', 'tags', 'tagIn'); box('tAsgIn', 'assignees', 'asgIn');
    on('ptagx', (i)=>{ d.tags.splice(+i, 1); redraw(); });
    on('pasgx', (i)=>{ d.assignees.splice(+i, 1); redraw(); });
    on('ptagadd', (k)=>{ if (!d.tags.some((h)=>same(h, k))) d.tags.push(k); redraw(); });
    on('pasgadd', (k)=>{ if (!d.assignees.some((h)=>same(h, k))) d.assignees.push(k); redraw(); });
    /* the checklist: Enter in the last line adds the item, ready for the next */
    d.checklist.forEach((it, i) => field('tCk'+i, (v)=>{ it.text = v; }));
    const ck = field('tCkIn', (v)=>{ d.ckIn = v; });
    if (ck) ck.onkeydown = (e) => { if (e.key!=='Enter') return; if (e.preventDefault) e.preventDefault();
      const v = (d.ckIn||'').trim(); if (v) d.checklist.push({ done:false, text:v }); d.ckIn = ''; redraw('tCkIn'); };
    on('pckt', (i)=>{ const it = d.checklist[+i]; if (it) it.done = !it.done; redraw(); });
    on('pckx', (i)=>{ d.checklist.splice(+i, 1); redraw(); });
    /* reminders */
    d.reminders.forEach((r, i) => { field('tRmD'+i, (v)=>{ r.date = v; }); field('tRmT'+i, (v)=>{ r.text = v; }); });
    on('prmadd', ()=>{ d.reminders.push({ done:false, date:TODAY(), text:'' }); redraw('tRmT'+(d.reminders.length-1)); });
    on('prmt', (i)=>{ const r = d.reminders[+i]; if (r) r.done = !r.done; redraw(); });
    on('prmx', (i)=>{ d.reminders.splice(+i, 1); redraw(); });
    /* costs: the currency of the last line is the one a new line starts in */
    d.costs.forEach((c, i) => { field('tCoN'+i, (v)=>{ c.name = v; }); field('tCoA'+i, (v)=>{ c.amount = v; }); });
    on('pcoadd', ()=>{ const last = d.costs[d.costs.length-1]; d.costs.push({ name:'', amount:'', cur: last ? last.cur : 'EUR' }); redraw('tCoN'+(d.costs.length-1)); });
    on('pcocur', (v)=>{ const [i, c] = v.split('|'); if (d.costs[+i]) d.costs[+i].cur = c; redraw(); });
    on('pcox', (i)=>{ d.costs.splice(+i, 1); redraw(); });
    on('pweek', ()=>{ d.week = !d.week; redraw(); });
    on('pstat', (s)=>{ d.status = s; redraw(); });
    on('psave', saveTask);
    on('tclose', ()=>{ if (isDirty() && !p.closeArm) { p.closeArm = true; p.delArm = false; render(); return; } state.page = null; render(); });
    on('pdel', ()=>{ if (!p.delArm) { p.delArm = true; p.closeArm = false; render(); return; }
      const t = store.tasks.find((x)=>x.id===d.id); state.page = null;
      if (t) { t.deleted = NOW(); t.updated = t.deleted; commit(t); } else render(); });
  }

  /* settings */
  const u = document.getElementById('bkUrl'), k = document.getElementById('bkTok');
  if (u) u.oninput = () => { store.backend.url = u.value.trim(); save(); };
  if (k) k.oninput = () => { store.backend.token = k.value.trim(); save(); };
  on('bktest', async()=>{
    state.sync = { msg:'Testing…' }; render();
    try { const j = await BK.ping(store.backend); store.backendVersion = j.backend; save(); state.sync = { msg:'Connected · backend v' + j.backend }; }
    catch (e) { state.sync = { msg:e.message, bad:true }; }
    render(); });
  on('bksync', ()=>syncNow(false));
}

render();
/* Open: read the sheet (and send what waited). Back on screen: again. */
if (connected()) syncNow(true);
if (typeof document.addEventListener === 'function') document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && connected()) syncNow(true); });

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
