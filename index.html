<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0f15">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Slate">
<title>Slate</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  /* Tally's tokens, unchanged, so the family of apps looks like one. */
  :root{
    --bg:#0d0f15; --bg2:#11131a; --card:#181b24; --card2:#1f2330; --line:#272b38;
    --txt:#eef1f7; --muted:#8a92a6; --accent:#3b82f6; --accent2:#7cb8ff;
    --good:#4ade80; --bad:#f87171; --warn:#fbbf24; --r:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;font-size:14px;}
  body{padding-top:env(safe-area-inset-top);padding-bottom:calc(72px + env(safe-area-inset-bottom));}
  .wrap{max-width:560px;margin:0 auto;padding:16px 16px 24px;}

  header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
    margin:0 -16px 12px;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line);}
  /* The name is a button: it opens the About widget. */
  header h1{font-size:20px;margin:0;letter-spacing:.3px;cursor:pointer;user-select:none;-webkit-user-select:none}
  header h1 .dot{color:var(--accent)}
  header .hdrright{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;font-weight:600}
  .syncdot{font-size:11px;font-weight:600;color:var(--muted)}
  .hdrbtn{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;width:28px;height:26px;
    cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0}
  .hdrbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .hdrbtn:active{color:var(--accent)}
  .hdrbtn.on{color:var(--accent);border-color:var(--accent)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;}
  .card h2{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);
    margin:0 0 6px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .card h2 .n{color:var(--txt);font-variant-numeric:tabular-nums;margin-left:6px}
  .card h2 .ttl{display:flex;align-items:center;min-width:0}
  .bmedit{background:none;border:1px solid var(--line);border-radius:7px;height:22px;width:26px;margin-left:8px;padding:0;font-size:11px;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;flex:none}
  .card h2 .hbtns{display:flex;align-items:center;gap:7px;text-transform:none;letter-spacing:0;font-weight:400}
  .muted{color:var(--muted)}
  .empty{font-size:12.5px;color:var(--muted);padding:8px 0 4px}

  /* A widget over the bottom half of the screen (About, a bookmark). */
  .sheetwrap{position:fixed;inset:0;z-index:40}
  .scrim{position:absolute;inset:0;background:rgba(0,0,0,.5)}
  .sheet{position:absolute;left:0;right:0;bottom:0;max-height:82vh;background:var(--card);
    border-top:1px solid var(--line);border-radius:20px 20px 0 0;padding:14px 16px calc(12px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:5px;overflow-y:auto;max-width:560px;margin:0 auto}
  /* Slides up once, when it opens; a redraw from a chip inside must not replay it. */
  .sheet.enter{animation:up .28s cubic-bezier(.2,.8,.2,1)}
  @keyframes up{from{transform:translateY(100%)}to{transform:none}}
  .sheet h3{margin:0 0 2px;font-size:16px}
  .sheet .foot{display:flex;gap:8px;padding-top:4px}
  .sheet .foot .btn.close{flex:0 0 auto;min-width:92px;background:var(--bg2)}
  .sheet .foot .btn.close.arm{background:var(--bad);border-color:var(--bad);color:#fff}

  /* A page of its own (a task, its editor): the content, then Close at the
     bottom, always in reach however long the page. */
  .page{padding-bottom:4px}
  .page .ptitle{display:flex;align-items:flex-start;gap:10px;margin:2px 0 10px}
  .page .ptitle h2{flex:1;margin:0;font-size:19px;line-height:1.25;overflow-wrap:anywhere}
  .page .ptitle .gbtn{height:28px;min-width:32px;font-size:14px}
  .page .sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:600;margin:12px 0 5px;
    display:flex;align-items:center;justify-content:space-between;gap:8px}
  .page .sec .gbtn{height:20px;min-width:22px;font-size:13px}
  .page .stamp{font-size:11px;color:var(--muted);margin-top:12px}
  .page .info{white-space:pre-wrap;font-size:13.5px;line-height:1.45;overflow-wrap:anywhere}
  /* the bottom bar, as in Tally: three tabs, the one showing in blue */
  nav{position:fixed;bottom:0;left:0;right:0;background:rgba(17,19,26,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border-top:1px solid var(--line);display:flex;justify-content:space-around;
    padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:30;}
  nav button{background:none;border:none;color:var(--muted);font-size:9px;white-space:nowrap;overflow:hidden;display:flex;flex-direction:column;
    align-items:center;gap:3px;cursor:pointer;padding:4px 1px;flex:1;min-width:0;font-family:inherit}
  nav button svg{width:21px;height:21px;display:block;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  nav button.active{color:var(--accent)}
  /* the Bookmarks tab's own bar, under the header, as in Tally */
  .subnav{position:sticky;top:calc(47px + env(safe-area-inset-top));z-index:15;display:flex;justify-content:space-around;background:var(--bg);
    border-bottom:1px solid var(--line);margin:-12px -16px 12px;padding:5px 0 6px}
  .subnav button{background:none;border:none;color:var(--muted);font-size:9px;display:flex;flex-direction:column;
    align-items:center;gap:2px;cursor:pointer;padding:2px 1px;flex:1;min-width:0;font-family:inherit;white-space:nowrap}
  .subnav button svg{width:17px;height:17px;display:block;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .subnav button.active{color:var(--accent)}
  /* Bookmarks' own row, under Checklist's bar */
  .subnav2{display:flex;gap:6px;overflow-x:auto;margin:-4px 0 12px;scrollbar-width:none}
  .subnav2::-webkit-scrollbar{display:none}
  .subnav2 .chip{flex:1 1 auto;justify-content:center;padding:3px 6px}
  .subnav2 svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  nav button .ico{position:relative;display:inline-block}
  nav button .cnt{position:absolute;top:-5px;left:15px;min-width:15px;height:15px;border-radius:8px;background:var(--accent);color:#fff;
    font-size:9px;font-weight:700;line-height:15px;padding:0 3px;text-align:center}
  nav button .cnt.late{background:var(--bad)}
  /* a page's Close sits just above the bottom bar */
  .closebar{position:sticky;bottom:calc(60px + env(safe-area-inset-bottom));z-index:12;margin:14px -16px 0;padding:10px 16px 8px;
    display:flex;gap:8px;background:linear-gradient(to top,var(--bg) 72%,transparent)}
  .closebar .btn{padding:13px;font-size:15px}
  .closebar .btn.close{flex:1;background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 6px 22px rgba(0,0,0,.45)}

  .field{margin-bottom:6px}
  .field>label,.field .lab{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:10.5px;color:var(--muted);
    margin-bottom:2px;text-transform:uppercase;letter-spacing:.5px}
  .field>label.keep{text-transform:none;letter-spacing:0;font-size:12.5px;color:var(--txt)} .field>label.keep span+span{color:var(--muted);font-size:11.5px}
  .field .lab .gbtn{height:20px;min-width:22px;font-size:13px}
  input,select,textarea{width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--txt);border-radius:10px;
    padding:5px 10px;font-size:14px;font-family:inherit;outline:none}
  textarea{resize:vertical;min-height:70px;line-height:1.4}
  input:focus,textarea:focus{border-color:var(--accent)}
  input[type=date]{color-scheme:dark}
  .btnrow{display:flex;gap:7px}
  .btn{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:11px;padding:8px 14px;
    font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;flex:1}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn:disabled{opacity:.45;cursor:default}
  .btn.danger{flex:0 0 auto;background:var(--bg2);border-color:var(--bad);color:var(--bad)}
  .btn.danger.arm{background:var(--bad);color:#fff}
  .hint{font-size:12.5px;color:var(--muted);line-height:1.45}
  .status{font-size:12.5px;margin-top:6px;font-weight:600}
  .status.ok{color:var(--good)} .status.bad{color:var(--bad)}

  .rows .row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
  .rows .row:last-child{border-bottom:0}
  .row .k{font-size:13.5px} .row .v{font-weight:700;font-variant-numeric:tabular-nums}

  /* Top-right group button: contour and the blue ground. */
  .gbtn{background:var(--accent);border:1px solid var(--accent);color:#fff;border-radius:8px;min-width:26px;height:24px;
    padding:0 7px;font-size:14px;font-weight:700;line-height:1;cursor:pointer;font-family:inherit;
    display:inline-flex;align-items:center;justify-content:center;text-transform:none;letter-spacing:0}

  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{background:var(--card2);border:1px solid var(--line);border-radius:18px;padding:4px 10px;color:var(--txt);
    font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .chip.sm{padding:2px 9px;font-size:11.5px}
  .chip.add{background:none;color:var(--muted);border-style:dashed}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
  .cap{font-size:11.5px;font-weight:600;border-radius:12px;padding:2px 9px;border:1px solid var(--line);color:var(--txt);background:var(--card2);
    display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .cap .x{opacity:.65;cursor:pointer;font-weight:700}
  .caps{display:flex;flex-wrap:wrap;gap:5px}
  .tagbox{display:flex;flex-wrap:wrap;gap:5px;align-items:center;background:var(--bg2);border:1px solid var(--line);
    border-radius:10px;padding:3px 8px;cursor:text;min-height:30px}
  .tagbox:focus-within{border-color:var(--accent)}
  .tagbox input{flex:1;min-width:90px;width:auto;background:none;border:0;padding:2px 2px}
  .sugg{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}

  /* The status: a dot of its colour. Backlog is black, so it gets a ring. */
  .sdot{display:inline-block;width:11px;height:11px;border-radius:50%;flex:none}
  .sdot.ring{box-shadow:0 0 0 1.5px var(--muted) inset}
  .spick{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 2px}

  /* A switch: a label with a sliding knob. */
  .switch{display:flex;align-items:center;gap:10px;margin-top:4px;cursor:pointer;font-size:13.5px}
  .switch .track{width:40px;height:22px;border-radius:11px;background:var(--line);position:relative;transition:background .15s;flex:none}
  .switch .track::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
  .switch .track.on{background:var(--accent)}
  .switch .track.on::after{left:20px}

  /* The progress bar: next steps done over all of them. */
  .bbar{height:5px;background:var(--bg2);border-radius:4px;overflow:hidden;margin:2px 0 6px}
  .bbar i{display:block;height:100%;border-radius:4px;background:var(--accent)}
  .bbar i.full{background:var(--good)}

  /* A tick box. */
  .ck{width:18px;height:18px;border:1.5px solid var(--muted);border-radius:5px;flex:none;display:inline-flex;align-items:center;
    justify-content:center;font-size:12px;color:#fff;cursor:pointer;font-weight:700}
  .ck.on{background:var(--accent);border-color:var(--accent)}

  /* The list: a dot and a name, one line each; the handle drags it. */
  .trow{display:flex;align-items:center;gap:11px;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .trow:last-child{border-bottom:0}
  .trow .tn{flex:1;min-width:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .trow.done .tn{color:var(--muted)}
  .trow.lift{background:var(--card2);border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.4);padding-left:6px}
  .drag{color:var(--muted);font-size:16px;line-height:1;padding:2px 2px 2px 10px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;flex:none}

  /* Bookmarks: the saved lists, along the top. */
  .bmbar{display:flex;gap:6px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none}
  .bmbar::-webkit-scrollbar{display:none}
  .bmbar .chip{flex:none}

  /* The filter, Bench's pattern by way of Tally: one round button, a panel
     that drops under it, chips for what is active. */
  .fdrop{position:relative}
  .fbtn{width:34px;height:26px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);color:var(--txt);cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;font-size:13px;padding:0}
  .fbtn.act{border-color:var(--accent);color:var(--accent2)}
  .fscrim{position:fixed;inset:0;z-index:8}
  .fmenu{position:absolute;right:0;top:100%;z-index:9;margin-top:6px;width:min(320px,88vw);display:flex;flex-direction:column;
    background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px;box-shadow:0 8px 24px -8px rgba(0,0,0,.6);
    text-align:left;font-weight:400;text-transform:none;letter-spacing:0}
  .fsearch{position:relative;margin-bottom:6px}
  .fsearch input{padding-right:30px}
  .fsearch .fx{position:absolute;right:9px;top:50%;transform:translateY(-50%);color:var(--muted);cursor:pointer;font-size:16px}
  .ovf-addf,.ovf-exclf{display:block;width:100%;text-align:left;background:none;border:none;font-size:13px;font-weight:600;padding:7px 9px;
    border-radius:7px;cursor:pointer;font-family:inherit}
  .ovf-addf{color:#4a9eff} .ovf-exclf{color:#ff5c6c}
  .ovf-exclf:disabled{opacity:.4;cursor:default}
  .fpick{max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:8px;margin:2px 0 6px}
  .fpick .grp{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:600;padding:7px 9px 2px}
  .fpick button{display:flex;align-items:center;gap:7px;width:100%;text-align:left;background:none;border:none;color:var(--txt);font-size:12.5px;padding:6px 9px 6px 16px;cursor:pointer;font-family:inherit}
  .fchips{display:flex;flex-wrap:wrap;gap:5px;margin:2px 0 6px}
  .fchip{display:inline-flex;align-items:center;gap:5px;background:var(--accent);color:#fff;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:600}
  .fchip.exc{background:#ff5c6c}
  .fchip.plain{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
  .fchip b{cursor:pointer;opacity:.75;font-weight:700}

  /* The editor's own lists: next steps, updates, costs. */
  .li{display:flex;align-items:center;gap:6px;margin-bottom:4px}
  .li .drag.l{padding:2px 2px 2px 0}
  .li.lift{background:var(--card2);border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.4)}
  .li input{padding:4px 8px;font-size:13px;min-width:0}
  .li input.d{flex:0 0 132px}
  .li input.a{flex:0 0 84px;text-align:right}
  .li .x{color:var(--muted);cursor:pointer;font-size:17px;line-height:1;padding:0 2px;flex:none}
  .li.done input.t{color:var(--muted);text-decoration:line-through}
  /* ...and as they read on the task's page. */
  .vli{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:13.5px}
  .vli .t{flex:1;min-width:0;overflow-wrap:anywhere}
  .vli.done .t{color:var(--muted);text-decoration:line-through}
  .vli .v{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
  .when{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;flex:none}
  .when.due{color:var(--warn)} .when.late{color:var(--bad)}
  .trow .when{font-size:11.5px}
  .li input.d{flex:0 0 118px;padding:4px 6px}
  .addupd{display:flex;gap:6px;align-items:flex-end;margin-bottom:6px}
  .addupd textarea{min-height:44px}
  .addupd .btn{flex:0 0 auto;padding:8px 12px}
  .lnk{color:var(--accent2);text-decoration:none;font-size:13.5px;overflow-wrap:anywhere;flex:1;min-width:0}
  .li input.t{flex:1 1 0}
  .li input.u{flex:1.4 1 0}
  .li .rp{flex:none;width:24px;height:24px;border-radius:7px;border:1px solid var(--line);background:var(--bg2);color:var(--muted);font-size:13px;line-height:1;padding:0;cursor:pointer;font-family:inherit}
  .li .rp.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .rept{display:block;font-size:11px;color:var(--accent2);margin-top:1px}
  .rept.ed{margin:-2px 0 5px 24px;cursor:pointer}
  .reppanel{margin:0 0 8px 24px;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--bg2);display:flex;flex-direction:column;gap:6px}
  .reppanel .rrow{display:flex;flex-wrap:wrap;align-items:center;gap:5px;font-size:12px}
  .reppanel .rrow>span:first-child{color:var(--muted);min-width:34px}
  .reppanel input{width:46px;flex:none;padding:3px 6px;text-align:center}
  .sday{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:600;padding:10px 0 3px;border-bottom:1px solid var(--line)}
  .sday:first-child{padding-top:2px}
  .sday.late{color:var(--bad)}
  .srow{display:flex;align-items:flex-start;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .srow .ck{margin-top:1px}
  .srow .st{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .srow .stx{font-size:14px;overflow-wrap:anywhere}
  .srow .stk{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .srow .stk .sdot{width:8px;height:8px}
  .srow .rp1{color:var(--accent2);font-size:12px}
  .upd{display:flex;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
  .upd .when{flex:0 0 46px;padding-top:2px}
  .upd .info{flex:1;min-width:0}
  /* Care: four tiles a row, each an icon and a name */
  .cgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:4px}
  .ctile{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 2px 8px;background:var(--card2);border:1px solid var(--line);
    border-radius:14px;cursor:pointer;min-width:0;aspect-ratio:1/1.08;justify-content:center;user-select:none;-webkit-user-select:none}
  .ctile:active{border-color:var(--accent)}
  .cgrid.order .ctile{cursor:grab;touch-action:none;border-style:dashed}
  .ctile.lift{border-color:var(--accent);box-shadow:0 4px 14px rgba(0,0,0,.45);transform:scale(1.04)}
  .cic{position:relative;display:inline-flex;color:var(--accent2)}
  .cic svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .cic.big svg{width:30px;height:30px}
  .calert{position:absolute;top:-3px;right:-5px;width:9px;height:9px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 2px var(--card2)}
  .cname{font-size:10.5px;line-height:1.2;text-align:center;max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
  .page.care .ptitle{align-items:center}
  .rd{display:flex;align-items:baseline;gap:8px;padding:6px 0 2px}
  .rd .k{flex:1;font-size:13.5px} .rd .v{font-weight:700;font-variant-numeric:tabular-nums}
  .rd .v.good{color:var(--good)} .rd .v.bad{color:var(--bad)}

const NOW = () => new Date().toISOString();
const ymd = (d) => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');

/* The step that comes next: the earliest due one not done. */

/* what a link shows: its label, else its site */
const linkText = (l) => l.label || siteOf(l.url) || l.url;

const dueThisWeek = (t) => { const d = nextDue(t); return !!d && d <= weekEnd(); };
/* ------------------------------------------------------ repeating steps --

   every N months, on a day of the month (or the last day), or on a weekday

   it is not done: the day goes into "last" and the step moves on to its next
   date - from the date it was due, so one paid late is still owed next time.

function canon(r){

}

function anchored(r, due){
  const d = dOf(due), dd = d.getDate(), out = { n:Math.max(1, +r.n||1), unit:r.unit, days:(r.days||[]).slice(), by:r.by||'date', day:r.day, nth:r.nth, wd:d.getDay(), month:d.getMonth()+1 };

  if (nth===-1) { const L = lastDay(y, m0); const back = (new Date(y, m0, L).getDay() - wd + 7) % 7; return L - back; }

/* the rule in words: "every 2 weeks on Mon, Thu", "every month on the 2nd Tue" */
function repeatText(r){
  if (!r) return '';

  if (!m) return null;

const dueClass = (d) => !d ? '' : d < TODAY() ? 'late' : d <= weekEnd() ? 'due' : '';
const r2 = (x) => Math.round(x*100)/100;
/* an amount as typed: a comma is a decimal point too */
const num = (a) => { const s = String(a==null?'':a).replace(',', '.').trim(); return s==='' || !isFinite(+s) ? null : +s; };

/* --------------------------------------------------------------- filters --
   Bench's way: a search, then + filters (keep what has one of them) and −
   filters (drop what has any), on the status, the tags, the assignees and
   when the next step is due. Within one kind any value will do; across
   kinds, all of them. Done tasks stay out of a list unless its filter picks
   a status. */
const KINDS = [['status','Status'], ['due','Due'], ['person','Assignee'], ['tag','Tag']];
const KIND_LABEL = Object.fromEntries(KINDS);
const NONE = '(none)';
/* Due: when the steps not done are due - Today (today, the late ones too),
   This week (by Sunday, today and the late ones too: a week runs Monday to
   Sunday), Next week (Monday to the Sunday after), Later, or (none). A task
   with steps on several of them is in each: one due this week and one next
   week shows in both lists. */
const DUES = ['Today', 'This week', 'Next week', 'Later'];
function dueOf(t){
  const td = TODAY(), we = weekEnd(), nwe = nextWeekEnd(), out = new Set();
  for (const st of t.steps) if (!st.done && st.due) { if (st.due <= td) out.add('Today');
    out.add(st.due <= we ? 'This week' : st.due <= nwe ? 'Next week' : 'Later'); }
  return DUES.filter((d)=>out.has(d));
}
const blankFilter = () => ({ q:'', inc:[], exc:[] });
const valuesOf = (t, kind) => kind==='status' ? [t.status] : kind==='tag' ? t.tags : kind==='due' ? dueOf(t) : t.assignees;
function matches(t, f, doneOk){
  const q = String(f.q||'').toLowerCase().split(/\s+/).filter(Boolean);
  if (q.length) { const hay = [t.name, t.updates.map((u)=>u.text).join(' '), t.links.map((l)=>l.label+' '+l.url).join(' '), t.tags.join(' '), t.assignees.join(' '), t.steps.map((i)=>i.text).join(' ')].join(' ').toLowerCase();
    if (!q.every((w)=>hay.includes(w))) return false; }
  const has = (e) => { const v = valuesOf(t, e.kind); return e.name===NONE ? !v.length : v.some((x)=>same(x, e.name)); };
  for (const [kind] of KINDS) { const inc = f.inc.filter((e)=>e.kind===kind); if (inc.length && !inc.some(has)) return false; }
  if (f.exc.some(has)) return false;
  if (t.status==='Done' && !doneOk && !f.inc.some((e)=>e.kind==='status')) return false;
  return true;
}
const filterKey = (f) => JSON.stringify([String(f.q||'').trim(), f.inc.map((e)=>e.kind+':'+e.name).sort(), f.exc.map((e)=>e.kind+':'+e.name).sort()]);
const filterOn = (f) => !!(String(f.q||'').trim() || f.inc.length || f.exc.length);
/* The bottom bar: This week, Next week, and the bookmarks. The two weeks are

const FIXED = {

  /* Coming up: not tasks but their steps - every one not done that has a date */
  nextweek:{ label:'Coming up', filter:{ q:'', inc:[{ kind:'due', name:'This week' }, { kind:'due', name:'Next week' }, { kind:'due', name:'Later' }], exc:[] }, sort:'due', steps:true },
  home:    { label:'Home',      filter:{ q:'', inc:[{ kind:'tag', name:'home' }], exc:[] },      sort:'custom' },
  finance: { label:'Finance',   filter:{ q:'', inc:[{ kind:'tag', name:'finance' }], exc:[] },   sort:'custom' },
  admin:   { label:'Admin',     filter:{ q:'', inc:[{ kind:'tag', name:'admin' }], exc:[] },     sort:'custom' },
  /* every task done, the last done first */
  archive: { label:'Archive',   filter:{ q:'', inc:[{ kind:'status', name:'Done' }], exc:[] },   sort:'done', noNew:true },

const BAR = [['checklist', 'Checklist'], ['care', 'Care']];
const CHECK_TABS = [['week', 'This week'], ['nextweek', 'Coming up'], ['group', 'Bookmarks']];
const isCheckTab = (k) => k==='week' || k==='nextweek' || GROUP.includes(k);

const isFixedTab = () => !!FIXED[state.tab];

/* The filter you set: on the Bookmarks tab the list's own; on a fixed tab one

/* -------------------------------------------------------------- bookmarks --

const SORTS = [['custom','Custom'], ['due','Due date'], ['name','Name'], ['person','Assignee'], ['status','Status']];

const STATUS_RANK = ['Blocked','In progress','Waiting','Todo','Backlog','Done'];
const bmLive = () => store.bookmarks.filter((b)=>!b.deleted);
const bmById = (id) => store.bookmarks.find((b)=>b.id===id && !b.deleted) || null;
const activeBm = () => isFixedTab() ? bmById(state.tab) : (store.bm && store.bm!=='all' && !FIXED[store.bm] && bmById(store.bm)) || null;
const orderKey = () => isFixedTab() ? state.tab : activeBm() ? store.bm : 'all';
const newBm = (id, name, filter, sort) => ({ id, name, filter:filter||blankFilter(), sort:sort||'custom', order:[], updated:'', deleted:'' });
function ensureOrder(id){
  let b = store.bookmarks.find((x)=>x.id===id);

const sortOf = () => { const b = store.bookmarks.find((x)=>x.id===orderKey()); return (b && b.sort) || 'custom'; };
const byName = (a, b) => a.name.localeCompare(b.name, undefined, { sensitivity:'base', numeric:true });
function shownTasks(){
  const f = curFilter(), b = store.bookmarks.find((x)=>x.id===orderKey()), ord = (b && b.order) || [], sort = sortOf();
  const ts = live().filter(listMatches);
  if (sort==='custom') {
    const pos = new Map(ord.map((id,i)=>[id,i]));
    const fresh = ts.filter((t)=>!pos.has(t.id)).sort((a,b)=>String(b.created).localeCompare(String(a.created)));
    return fresh.concat(ts.filter((t)=>pos.has(t.id)).sort((a,b)=>pos.get(a.id)-pos.get(b.id)));
  }
  /* a task with nothing to sort on goes last */
  const last = (x, y, cmp) => !x && !y ? 0 : !x ? 1 : !y ? -1 : cmp(x, y);
  const by = {
    due: (a,b) => last(nextDue(a), nextDue(b), (x,y)=>x.localeCompare(y)),
    name: () => 0,
    done: (a,b) => last(b.doneOn, a.doneOn, (x,y)=>x.localeCompare(y)) || String(b.updated).localeCompare(String(a.updated)),
    person: (a,b) => last(a.assignees[0], b.assignees[0], (x,y)=>x.localeCompare(y, undefined, { sensitivity:'base' })),
    status: (a,b) => STATUS_RANK.indexOf(a.status) - STATUS_RANK.indexOf(b.status) || last(nextDue(a), nextDue(b), (x,y)=>x.localeCompare(y)),
  }[sort] || (()=>0);

/* Move the task at `from` to `to` in the list as shown; the list's order
   becomes what is shown, followed by what it held that is not showing. */
function moveTask(from, to){
  const seq = shownTasks().map((t)=>t.id);
  if (from===to || from<0 || to<0 || from>=seq.length || to>=seq.length) return false;
  const [x] = seq.splice(from, 1); seq.splice(to, 0, x);
  const b = ensureOrder(orderKey());
  const alive = new Set(live().map((t)=>t.id));
  b.order = seq.concat(b.order.filter((id)=>!seq.includes(id) && alive.has(id)));
  b.updated = NOW(); save();
  return true;
}

/* Every task kept by an older version takes the shape of this one (see
   migrateTask), and goes up again so the sheet takes it too. This week and
   Next week are lists of their own from the start: bookmarks on the Due
   filter, by due date - deletable like any other, and a phone that has never seen it makes it
   with no date, so the sheet's (or its deletion) always wins. */
for (const t of store.tasks) if (migrateTask(t) && !store.dirty.includes('T:'+t.id)) store.dirty.push('T:'+t.id);
for (const b of store.bookmarks) if (!b.sort) b.sort = 'custom';
for (const t of store.tasks) if (t.status==='Action needed') { t.status = 'Waiting'; if (!store.dirty.includes('T:'+t.id)) store.dirty.push('T:'+t.id); }
{ const fix = (f) => { let n = 0; for (const e of (f ? f.inc.concat(f.exc) : [])) if (e.kind==='status' && e.name==='Action needed') { e.name = 'Waiting'; n++; } return n; };
  for (const b of store.bookmarks) if (fix(b.filter) && !store.dirty.includes('B:'+b.id)) store.dirty.push('B:'+b.id);
  fix(store.filter); for (const k in (store.tabFilters||{})) fix(store.tabFilters[k]); }
for (const id of FIXED_IDS) {
  const b = store.bookmarks.find((x)=>x.id===id);
  if (!b) { store.bookmarks.push(newBm(id, FIXED[id].label, JSON.parse(JSON.stringify(FIXED[id].filter)), FIXED[id].sort)); store.dirty.push('B:'+id); }
  /* they are tabs now: one deleted before comes back */
  else if (b.deleted) { b.deleted = ''; b.updated = new Date().toISOString(); store.dirty.push('B:'+id); }
  /* Next week is Coming up since v12; This week's own list is Today since v17 */
  else if (b.name !== FIXED[id].label || JSON.stringify(b.filter && [b.filter.inc, b.filter.exc]) !== JSON.stringify([FIXED[id].filter.inc, FIXED[id].filter.exc])) { b.name = FIXED[id].label; b.filter = JSON.parse(JSON.stringify(FIXED[id].filter)); b.updated = new Date().toISOString(); store.dirty.push('B:'+id); }
}
/* the bookmarks tab shows All or one of yours; the fixed lists have their own tabs */
if (FIXED[store.bm]) store.bm = 'all';
if (LIST_TABS.some(([k])=>k===store.tab) || store.tab==='care') { state.tab = store.tab; state.lastTab = store.tab; }
if (!inGroup(store.sub)) store.sub = inGroup(store.tab) ? store.tab : 'home';
if (!isCheckTab(store.check)) store.check = isCheckTab(store.tab) ? store.tab : 'week';

/* ------------------------------------------------------- the sheet's rows --
   Tasks: one row per task. The lists sit in one cell each, one line per
   item, written so they read well in the sheet and can be typed by hand:
     Next steps  [x] buy paint / [ ] 2026-11-12 call the plumber (a due date, if any)
     Updates     2026-11-05: what happened (newest first; a line with no date
                 goes on with the update above it)
     Costs       45.90 EUR Paint, [x] 12.00 EUR Brush (paid)   Tags, Assignees   comma-separated
   The columns of the older versions (Checklist, Reminders, Info, This week)
   are still read, and written back empty while the sheet has them, so a row
   is moved over the first time it goes up; then they can be deleted.
   Bookmarks: one row per list; the filter one line per part
   (Search: paint / + Status: Todo / - Tag: garden), how it sorts, the order
   as task ids. */
const TASK_HEADERS = ['Id','Name','Status','Created','Updated','Done on','Tags','Assignees','Next steps','Updates','Links','Costs','Deleted'];

const lines = (s) => String(s==null?'':s).split(/\r?\n/).map((x)=>x.trim()).filter(Boolean);
const list = (s) => String(s==null?'':s).split(',').map((x)=>x.trim()).filter(Boolean);
/* a repeating step carries its rule at the end: [ ] 2026-12-01 Pay rent (every month on the 1st; last 2026-11-02) */
const stepLine = (s) => (s.done?'[x] ':'[ ] ') + (s.due ? s.due + ' ' : '') + s.text + (s.repeat ? ' (' + repeatText(s.repeat) + (s.last ? '; last ' + s.last : '') + ')' : '');
const readSteps = (cell) => lines(cell).map((l)=>{ const m = /^(?:\[([ xX])\]\s*)?(\d{4}-\d{2}-\d{2})?\s*(.*)$/.exec(l);
  let text = m[3]||'', repeat = null, last = '';
  const r = /\s*\((every [^()]*?)(?:;\s*last\s+(\d{4}-\d{2}-\d{2}))?\)\s*$/i.exec(text);
  if (r && (repeat = readRepeat(r[1]))) { text = text.slice(0, r.index); last = r[2]||''; }
  return { done:!!(m[1] && m[1]!==' ') && !repeat, text, due:m[2]||'', repeat, last }; });
function readUpdates(cell){
  const out = [];
  for (const l of String(cell==null?'':cell).split(/\r?\n/)) {
    const m = /^(\d{4}-\d{2}-\d{2}):\s?(.*)$/.exec(l);
    if (m) out.push({ date:m[1], text:m[2] });

const taskHeaders = () => TASK_HEADERS.concat(store.legacyCols || []);
function taskRow(t){

const hasLegacy = (o) => LEGACY.some((k)=>String(o[k]==null?'':o[k]).trim()) || /^\s*action needed\s*$/i.test(String(o.Status==null?'':o.Status));
function readTask(o){
  const g = (k) => o[k]==null ? '' : String(o[k]);

const filterText = (f) => [String(f.q||'').trim() ? 'Search: '+String(f.q).trim() : null,

    m = /^([+\-−])\s*(status|due|assignee|tag)s?:\s*(.+)$/i.exec(l); if (!m) continue;

const bmRow = (b) => [b.id, b.name, filterText(b.filter), SORT_LABEL[b.sort||'custom'], b.order.join(', '), b.updated, b.deleted||''];
const readBm = (o) => { const g = (k) => o[k]==null ? '' : String(o[k]);
  const sort = (SORTS.find(([k,lab])=>same(lab, g('Sort')) || same(k, g('Sort'))) || ['custom'])[0];
  return { id:g('Id'), name:g('Name') || (g('Id')==='all' ? 'All' : ''), filter:readFilter(g('Filter')), sort, order:list(g('Order')), updated:g('Updated'), deleted:g('Deleted') }; };

const CARE_COLS = [['Id','id'], ['Name','name'], ['Kind','kind'], ['Order','order'], ['Details','details'], ['Secrets','secrets'], ['Readings','readings'], ['Task','task'], ['Updated','updated'], ['Deleted','deleted']];
const LOG_COLS = [['Id','id'], ['Item','item'], ['Date','date'], ['Values','values'], ['Note','note'], ['Updated','updated'], ['Deleted','deleted']];
const GUIDE_COLS = [['Id','id'], ['Item','item'], ['Order','order'], ['Title','title'], ['Text','text'], ['Updated','updated'], ['Deleted','deleted']];
const blankOf = (cols) => Object.fromEntries(cols.map(([, f])=>[f, '']));
const TABS = { T:{ name:'Tasks', headers:taskHeaders, row:taskRow, read:readTask, key:'tasks' },
               B:{ name:'Bookmarks', headers:()=>BM_HEADERS, row:bmRow, read:readBm, key:'bookmarks' },
               C:plainTab('Care', 'care', CARE_COLS),

for (const p of ['C','L','G']) if (!Array.isArray(store[TABS[p].key])) store[TABS[p].key] = [];


/* ------------------------------------------------------------------- sync --
   Every edit marks its record; shortly after, the marked records go to the
   sheet, each with the row as this phone last saw it there (its base). The
   sheet takes a record whose row has not changed since; one changed in the
   meantime (another phone, a hand edit) comes back as a conflict, and the
   two are merged here (see mergeRec) and sent again. The answer is every
   record, which replaces what is here - except a record still waiting to go
   up, and a record the sheet does not have: that one is never dropped, it
   goes back up (a sheet emptied by accident fills again from the phones).
   The phone says which version of the app it is; one older than the newest
   seen is refused, and asked to reload. The sheet is read again whenever the
   app comes back to the screen, so what the rest of the family did shows. */
const connected = () => !!(store.backend.url && store.backend.token);
let syncTimer = null, syncing = null, again = false;
const markDirty = (k) => { if (!store.dirty.includes(k)) store.dirty.push(k); };
const recOf = (k) => store[TABS[k[0]].key].find((x)=>x.id===k.slice(2));
if (!store.base || typeof store.base !== 'object') store.base = {};
function syncSoon(){ if (!connected()) return; clearTimeout(syncTimer); syncTimer = setTimeout(()=>syncNow(true), 600); }
async function syncNow(quiet){
  if (!connected()) { state.sync = { msg:'Not connected.', bad:true }; render(); return; }
  if (syncing) { again = true; return syncing; }
  const sent = {};
  for (const k of store.dirty) { const r = recOf(k); if (r) sent[k] = r.updated; }
  const keys = Object.keys(sent);
  const tabs = Object.keys(TABS).map((p)=>{ const T = TABS[p], ids = keys.filter((k)=>k[0]===p).map((k)=>k.slice(2));
    if (!ids.length) return null;
    const recs = store[T.key].filter((x)=>ids.includes(x.id));
    return { name:T.name, headers:T.headers(), rows:recs.map(T.row), bases:recs.map((x)=>store.base[p+':'+x.id] || null) }; }).filter(Boolean);
  if (!quiet) { state.sync = { msg:'Syncing…' }; render(); }
  syncing = (async () => {
    try {
      const j = await BK.sync(store.backend, tabs, Number(APP_VERSION));
      const conflicted = new Set();
      for (const p of Object.keys(TABS)) for (const id of ((j.conflicts||{})[TABS[p].name]||[])) conflicted.add(p+':'+id);
      /* what went up and was taken is no longer waiting - unless it changed again since */
      store.dirty = store.dirty.filter((k)=>!(k in sent) || conflicted.has(k) || (recOf(k)||{}).updated !== sent[k]);
      for (const p of Object.keys(TABS)) absorb(p, j.tabs || [], conflicted);
      store.backendVersion = j.backend; store.syncedAt = NOW(); store.stale = false; save();
      state.sync = { msg:'Synced ' + new Date().toTimeString().slice(0,5) + (keys.length ? ' · ' + (keys.length - conflicted.size) + ' sent' : '')
        + (conflicted.size ? ' · ' + conflicted.size + ' merged with another phone' : '') };
    } catch (e) {
      /* a newer version has synced: this copy writes nothing until it reloads */
      if (/ is out /.test(e.message)) store.stale = true;
      state.sync = { msg:e.message, bad:true };
    }
  })();
  await syncing; syncing = null;
  render();
  if (again) { again = false; if (store.dirty.length) return syncNow(true); }
}
function absorb(p, tabs, conflicted){
  const T = TABS[p], tab = tabs.find((t)=>t.name===T.name);
  conflicted = conflicted || new Set();
  /* no such tab in the sheet: everything here goes up to make it again */
  if (!tab) {
    if (store[T.key].length) { for (const x of store[T.key]) { markDirty(p+':'+x.id); delete store.base[p+':'+x.id]; } syncSoon(); }
    return;
  }
  /* the older columns the sheet still has: written back empty, and a row
     that still holds something in them goes up again, moved over */
  if (p==='T') store.legacyCols = LEGACY.filter((k)=>(tab.headers||[]).map((h)=>String(h).trim()).includes(k));
  let more = 0;
  const waiting = new Set(store.dirty.filter((k)=>k[0]===p).map((k)=>k.slice(2)));
  const here = new Map(store[T.key].map((x)=>[x.id, x]));
  const out = [];
  for (const o of records(tab)) {
    const r = T.read(o), l = here.get(r.id), key = p+':'+r.id;
    if (l && waiting.has(r.id)) {
      /* changed here and in the sheet: both kept, the result goes up again */
      if (conflicted.has(key)) { out.push(mergeRec(p, store.base[key] || {}, l, o)); more++; }
      else out.push(l);
    } else {
      out.push(r);
      if (p==='T' && hasLegacy(o)) { markDirty(key); more++; }
    }
    store.base[key] = o;
    here.delete(r.id);
  }
  /* not in the sheet: never dropped here - back up it goes */
  for (const l of here.values()) { out.push(l); markDirty(p+':'+l.id); delete store.base[p+':'+l.id]; more++; }
  store[T.key] = out;
  if (more) syncSoon();
}

/* -------------------------------------------------------------- merging --
   Three rows: the base (the sheet's row when this phone last saw it), mine
   (this phone's now) and theirs (the sheet's now). Column by column: what
   only one side changed, that side's; what both changed, merged where it is
   a list - the updates of both, the steps, links, costs, tags and assignees
   added on either, without what either removed - else mine. */
const cellOf = (x) => x==null ? '' : String(x);
function lines3(b, m, t, split, join){
  const B = split(b), M = split(m), T = split(t);
  const gone = B.filter((x)=>!T.includes(x));              /* removed over there */
  return join(M.filter((x)=>!gone.includes(x)).concat(T.filter((x)=>!B.includes(x) && !M.includes(x))));
}
const byLine = (b, m, t) => lines3(b, m, t, lines, (a)=>a.join('\n'));
const byComma = (b, m, t) => lines3(b, m, t, list, (a)=>a.join(', '));
/* steps: by line, then one step a text - this phone's when both have it */
const bySteps = (b, m, t) => { const seen = new Set();
  return byLine(b, m, t).split('\n').filter((l)=>{ if (!l) return false; const s = readSteps(l)[0]; const k = s ? s.text.trim().toLowerCase() : l;
    if (seen.has(k)) return false; seen.add(k); return true; }).join('\n'); };
/* updates: whole entries (one may run over several lines), newest first */
const byUpdates = (b, m, t) => {
  const ent = (c) => readUpdates(c).map((u)=>(u.date ? u.date + ': ' : '') + u.text);
  const out = lines3(b, m, t, ent, (a)=>a);
  const date = (e) => (/^(\d{4}-\d{2}-\d{2}):/.exec(e)||[])[1] || '';
  return out.map((e,i)=>[e,i]).sort((x,y)=>date(y[0]).localeCompare(date(x[0])) || x[1]-y[1]).map((x)=>x[0]).join('\n');
};
const MERGE = { T:{ 'Next steps':bySteps, 'Updates':byUpdates, 'Links':byLine, 'Costs':byLine, 'Tags':byComma, 'Assignees':byComma }, B:{},
  C:{ 'Details':byLine, 'Secrets':byLine, 'Readings':byLine }, L:{ 'Values':byLine }, G:{} };
function mergeRec(p, base, mine, theirs){
  const T = TABS[p], heads = T.headers(), row = T.row(mine), out = {};
  heads.forEach((h, i)=>{
    const b = cellOf(base[h]), m = cellOf(row[i]), t = cellOf(theirs[h]);
    out[h] = m===b ? t : t===b ? m : MERGE[p][h] ? MERGE[p][h](b, m, t) : m;
  });
  const rec = T.read(out);
  rec.updated = NOW();
  return rec;
}

/* ------------------------------------------------------ export, import --
   Export: every task and every list on this phone (the deleted ones too,
   so an import cannot bring them back), in one file. The sheet's address
   and token stay out of it.
   Import: a file merged into what is here; nothing here is dropped. A task
   or list this phone lacks is added. One it has, changed: the newer of the
   two (by when it last changed) gives the name, status, dates, deleted...,
   and the lists are both sides' - steps (one a text), updates, links,
   costs, tags, assignees. What changed here goes up to the sheet. */
function exportData(){
  return { app:'Slate', format:1, version:APP_VERSION, exported:NOW(),
    tasks:JSON.parse(JSON.stringify(store.tasks)), bookmarks:JSON.parse(JSON.stringify(store.bookmarks)),
    care:JSON.parse(JSON.stringify(store.care)), careLog:JSON.parse(JSON.stringify(store.careLog)), guides:JSON.parse(JSON.stringify(store.guides)) };
}
function downloadExport(){
  const blob = new Blob([JSON.stringify(exportData(), null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);

}
const arr = (x) => Array.isArray(x) ? x : [];
function importTask(t){
  if (!t || typeof t !== 'object' || !t.id) return null;
  const x = Object.assign(blank(), t, { id:String(t.id) });
  for (const k of ['steps','updates','links','tags','assignees','costs']) x[k] = arr(x[k]);
  migrateTask(x);
  x.status = statusOf(x.status) || 'Todo';
  return x;
}
function importBm(b){
  if (!b || typeof b !== 'object' || !b.id) return null;
  const f = b.filter && typeof b.filter === 'object' ? b.filter : {};
  return { id:String(b.id), name:String(b.name||''), filter:{ q:String(f.q||''), inc:arr(f.inc), exc:arr(f.exc) },
    sort:b.sort||'custom', order:arr(b.order).map(String), updated:String(b.updated||''), deleted:String(b.deleted||'') };
}
/* a Care, Care log or Guides record: its columns, each as text */
const importPlain = (p) => (x) => { if (!x || typeof x !== 'object' || !x.id) return null;
  const T = TABS[p], o = {}; T.headers().forEach((h, i)=>{ o[h] = T.row(x)[i]; }); return T.read(o); };
/* the same record, whenever it last changed? */
const sameRec = (p, a, b) => { const T = TABS[p], u = T.headers().indexOf('Updated'), ra = T.row(a), rb = T.row(b);
  return ra.every((c, i)=>i===u || String(c)===String(rb[i])); };
function mergeIn(p, rec, n){
  const T = TABS[p], all = store[T.key], i = all.findIndex((x)=>x.id===rec.id);
  if (i < 0) { all.push(rec); markDirty(p+':'+rec.id); n.added++; return; }
  const here = all[i];
  if (sameRec(p, here, rec)) { n.same++; return; }
  const newer = String(rec.updated||'') > String(here.updated||'') ? rec : here, older = newer===rec ? here : rec;
  const heads = T.headers(), m = T.row(newer), o = T.row(older), out = {};
  heads.forEach((h, j)=>{ out[h] = MERGE[p][h] ? MERGE[p][h]('', cellOf(m[j]), cellOf(o[j])) : m[j]; });
  const got = T.read(out);
  if (p==='B' && FIXED[got.id]) { got.name = FIXED[got.id].label; got.filter = JSON.parse(JSON.stringify(FIXED[got.id].filter)); got.deleted = ''; }
  if (sameRec(p, here, got)) { n.same++; return; }
  got.updated = NOW();
  all[i] = got; markDirty(p+':'+got.id); n.merged++;
}
/* a file's text in; how many tasks were added, merged and already here */
function importData(text){
  let d;
  try { d = JSON.parse(text); } catch (e) { throw new Error('Not a Slate export (not JSON).'); }
  if (!d || typeof d !== 'object' || !['tasks','bookmarks','care','careLog','guides'].some((k)=>Array.isArray(d[k]))) throw new Error('Not a Slate export (no tasks).');
  const n = { added:0, merged:0, same:0 }, nb = { added:0, merged:0, same:0 };
  for (const t of arr(d.tasks).map(importTask).filter(Boolean)) mergeIn('T', t, n);
  for (const b of arr(d.bookmarks).map(importBm).filter(Boolean)) mergeIn('B', b, nb);
  const nc = { added:0, merged:0, same:0 };
  for (const [p, k] of [['C','care'], ['L','careLog'], ['G','guides']]) for (const x of arr(d[k]).map(importPlain(p)).filter(Boolean)) mergeIn(p, x, nc);
  save(); syncSoon();
  return { tasks:n, bookmarks:nb, care:nc };
}
async function importFile(file){
  if (!file) return;
  try {
    const r = importData(await file.text()), t = r.tasks, b = r.bookmarks;
    state.io = { msg:'Imported · ' + t.added + ' new, ' + t.merged + ' merged, ' + t.same + ' already here'
      + (b.added + b.merged ? ' · lists: ' + b.added + ' new, ' + b.merged + ' merged' : '')
      + (r.care.added + r.care.merged ? ' · care: ' + r.care.added + ' new, ' + r.care.merged + ' merged' : '') };
  } catch (e) { state.io = { msg:e.message, bad:true }; }
  render();
}

function filterChips(f){

/* An update: what was typed, dated today, on top. */

  t.updates.unshift({ date:TODAY(), text:v });

function openEditor(id){

    /* a new task in a filtered list starts with what the list asks for */

    if (st.length===1) d.status = st[0].name;

/* The page's draft of a task: a copy, kept in the task as it is typed. What
   is half-typed in the empty lines (a step, a budget line, an update, a link,
   a tag) lives here too, and survives the draft being made again. */
const PENDING = { tagIn:'', asgIn:'', stIn:'', upIn:'', lkIn:'', coN:'', coA:'' };
function draftOf(t, d, ui){
  return Object.assign({ id: t ? t.id : null, d:Object.assign(d || clone(t), PENDING), seen: t ? t.updated : '', delArm:false, rep:null, statPick:false }, ui);
}
/* A task changed under its page (a sync, another phone): the page takes it,
   keeping what was being typed and where it was. */
function freshDraft(){
  const E = state.edit; if (!E || !E.id) return;
  const t = store.tasks.find((x)=>x.id===E.id);
  if (!t || t.deleted) { state.edit = null; state.view = null; return; }
  if (t.updated === E.seen) return;
  const keep = {}; for (const k in PENDING) keep[k] = E.d[k];
  E.d = Object.assign(clone(t), keep); E.seen = t.updated; E.rep = null;
}
/* The draft as it is stored: no empty lines, amounts as numbers. */
function cleaned(d){
  return {
    name:d.name.trim(), tags:d.tags.slice(), assignees:d.assignees.slice(),
    steps:d.steps.map((s)=>({ done:!!s.done && !s.repeat, text:s.text.trim(), due:s.due||'', repeat:s.repeat ? clone(s.repeat) : null, last:s.last||'' })).filter((s)=>s.text || s.due),
    updates:d.updates.map((u)=>({ date:u.date, text:u.text.replace(/\s+$/, '') })).filter((u)=>u.text.trim()),
    links:d.links.map((l)=>({ label:l.label.trim(), url:linkUrl(l.url) })).filter((l)=>l.url),
    costs:d.costs.map((c)=>{ const v = num(c.amount); return { name:c.name.trim(), amount: v==null ? '' : r2(v), cur:c.cur, paid:!!c.paid }; }).filter((c)=>c.name || c.amount!==''),
  };
}
/* Keep the draft: into the task (made now if it is new and has a name). */
function keepDraft(quiet){
  const e = state.edit; if (!e) return;
  const d = e.d, c = cleaned(d);
  let t = e.id ? store.tasks.find((x)=>x.id===e.id) : null;
  if (!t) { if (!c.name) return; t = Object.assign(blank(), { id:uid(), created:NOW() }); t.status = ''; store.tasks.push(t); e.id = t.id; }
  if (!c.name) c.name = t.name;            // an emptied name keeps the one it had
  const before = JSON.stringify(taskRow(t));
  Object.assign(t, c); setStatus(t, d.status);
  if (JSON.stringify(taskRow(t)) === before) return;
  t.updated = NOW(); e.seen = t.updated;
  commit('T:'+t.id, quiet);
}
function boxField(label, field, inId, xAttr, addAttr){

/* the repeat of a step: every N, the unit, then what it falls on */
function repeatPanel(st, i){
  const r = st.repeat;
  if (!r) return '';
  const d = dOf(st.due || TODAY()), dd = d.getDate(), lastWk = dd + 7 > lastDay(d.getFullYear(), d.getMonth());
  const unitChips = ['day','week','month','year'].map((u)=>`<button class="chip sm${r.unit===u?' on':''}" data-prunit="${u}">${u}${r.n>1?'s':''}</button>`).join('');
  let on = '';
  if (r.unit==='week') on = [1,2,3,4,5,6,0].map((w)=>`<button class="chip sm${r.days.includes(w)?' on':''}" data-prwd="${w}">${WD[w]}</button>`).join('');
  if (r.unit==='month') on = [['date', 'the ' + ORD(dd)], ['weekday', 'the ' + ORD(Math.ceil(dd/7)) + ' ' + WD[d.getDay()]]]
      .concat(dd === lastDay(d.getFullYear(), d.getMonth()) ? [['lastday', 'the last day']] : [], lastWk ? [['lastwd', 'the last ' + WD[d.getDay()]]] : [])
      .map(([k, lab])=>{ const cur = r.by==='weekday' ? (r.nth===-1 ? 'lastwd' : 'weekday') : (r.day===-1 ? 'lastday' : 'date');
        return `<button class="chip sm${cur===k?' on':''}" data-prby="${k}">${esc(lab)}</button>`; }).join('');
  if (r.unit==='year') on = `<span class="muted" style="font-size:12px">on ${dd} ${MON[d.getMonth()]}</span>`;
  return `
      <div class="reppanel">
        <div class="rrow"><span>Every</span><input id="tRn" inputmode="numeric" value="${r.n}">${unitChips}</div>
        ${on ? `<div class="rrow"><span>on</span>${on}</div>` : ''}
        <div class="rrow"><span class="muted" style="flex:1">${esc(repeatText(r))} · next ${esc(dLabel(st.due))}</span><button class="chip sm add" data-proff="${i}">No repeat</button></div>
      </div>`;
}
/* The editor's step at from goes to to; an open repeat panel follows its step. */
function moveStep(from, to){
  const E = state.edit, d = E && E.d;
  if (!d || to===from || from<0 || to<0 || from>=d.steps.length || to>=d.steps.length) return false;
  const [m] = d.steps.splice(from, 1); d.steps.splice(to, 0, m);
  const r = E.rep;
  if (r===from) E.rep = to; else if (r!=null && from<r && to>=r) E.rep = r-1; else if (r!=null && from>r && to<=r) E.rep = r+1;
  return true;
}

const kindOf = (c) => CARE_KINDS[c.kind] || CARE_KINDS.other;

    const d = { name, unit:unit||'', lo:null, hi:null, meter:/^meter$/i.test(range||'') };

const logsOf = (id) => store.careLog.filter((l)=>l.item===id && !l.deleted).sort((a,b)=>String(b.date).localeCompare(String(a.date)) || String(b.updated).localeCompare(String(a.updated)));

/* a meter: what was used per day between two readings */
const perDay = (pts) => pts.slice(1).map((p, i)=>{ const q = pts[i], days = (dOf(p.date) - dOf(q.date)) / 864e5;

const careTask = (c) => c.task ? store.tasks.find((t)=>t.id===c.task && !t.deleted) || null : null;

function careAlert(c){

}
const ago = (d) => { const n = Math.round((dOf(TODAY()) - dOf(String(d).slice(0,10))) / 864e5);

const fmtV = (v) => String(v).replace(/\.0+$/, '');

/* ----------------------------------------------------------- the guides --
   A guide is one row per section; its text is a light Markdown: paragraphs,
   "- " and "1. " lists, **bold**, "> " a note, "| a | b |" tables, "### "
   a heading, ![caption](photo.jpg) a photo from the Drive folder, and

/* A photo: from this phone's own cache, else through the script (it reads the

    const key = new URL('photo/' + encodeURIComponent(name), location.href).href;
    let blob = null;
    if (typeof caches !== 'undefined') { const hit = await (await caches.open(PHOTO_CACHE)).match(key); if (hit) blob = await hit.blob(); }
    if (!blob) {
      if (!connected()) throw new Error('Connect the sheet to see the photos.');
      const j = await BK.photo(store.backend, name);
      blob = b64Blob(j.data, j.type);
      if (typeof caches !== 'undefined') try { await (await caches.open(PHOTO_CACHE)).put(key, new Response(blob, { headers:{ 'Content-Type':j.type } })); } catch (e) { /* full: shown all the same */ }

    if (n) n.oninput = () => { m.name = n.value; if (m.closeArm || m.delArm || m.msg) { m.closeArm = m.delArm = false; m.msg = null; render(); } };
    on('bmclose', ()=>{ const b = m.id ? bmById(m.id) : null;
      if (m.name.trim() !== (b ? b.name : '') && !m.closeArm) { m.closeArm = true; m.delArm = false; render(); return; }
      state.bmEdit = null; render(); });
    on('bmsave', ()=>{ const name = m.name.trim();
      if (!name) { m.msg = 'A name first.'; render(); return; }
      if (bmLive().some((x)=>x.id!==m.id && same(x.name, name))) { m.msg = 'There is one by that name.'; render(); return; }
      let b = m.id ? bmById(m.id) : null;
      if (!b) { b = newBm(uid('b'), name, clone(m.filter), sortOf());
        /* it starts in the order the list shows now */
        b.order = shownTasks().map((t)=>t.id); store.bookmarks.push(b); store.bm = b.id; }
      b.name = name; b.updated = NOW(); state.bmEdit = null; commit('B:'+b.id); });
    on('bmdel', ()=>{ if (!m.delArm) { m.delArm = true; m.closeArm = false; render(); return; }
      const b = bmById(m.id); state.bmEdit = null;
      if (b) { b.deleted = NOW(); b.updated = b.deleted; if (store.bm===b.id) { store.bm = 'all'; store.filter = blankFilter(); } commit('B:'+b.id); } else render(); });
  }

  /* the editor: every change kept at once */
  const E = state.edit;
  if (E) {
    const d = E.d;
    const redraw = (focus) => { E.delArm = false; keepDraft(true); E.focus = focus || null; render(); };
    /* two taps: the first arms the line's ×, the second deletes it */
    const twoTap = (key, del) => { if (E.delArm !== key) { E.delArm = key; render(); return; } E.delArm = false; del(); redraw(); };
    on('ptab', (k)=>{ settlePending(); E.tab = k; E.rep = null; redraw(); });
    on('pmeta', (v)=>{ settleBox('tags', 'tagIn'); settleBox('assignees', 'asgIn'); E.meta = v==='1'; E.statPick = false; redraw(v==='1' ? 'tName' : null); });
    on('vstat', ()=>{ E.statPick = !E.statPick; render(); });
    /* a row dragged by its handle: the list takes the order shown */
    const dragRows = (dragAttr, rowAttr, key, move) => document.querySelectorAll('[data-'+dragAttr+']').forEach((el)=>{
      el.onpointerdown = (ev0) => {
        if (ev0 && ev0.preventDefault) ev0.preventDefault(); if (ev0 && ev0.stopPropagation) ev0.stopPropagation();
        if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
        let at = +el.dataset[dragAttr.replace(/-(.)/g, (m, c)=>c.toUpperCase())], moved = false; E.drag = key + at; render();
        const mv = (ev) => { let to = at;
          document.querySelectorAll('[data-'+rowAttr+']').forEach((r)=>{ const b = r.getBoundingClientRect(); if (ev.clientY > b.top && ev.clientY < b.bottom) to = +r.dataset[rowAttr]; });
          if (to!==at && move(at, to)) { at = to; moved = true; E.drag = key + at; render(); } };
        const up = () => { document.removeEventListener('pointermove', mv); document.removeEventListener('pointerup', up); document.removeEventListener('pointercancel', up);
          E.drag = null; if (moved) redraw(); else render(); };
        document.addEventListener('pointermove', mv); document.addEventListener('pointerup', up); document.addEventListener('pointercancel', up);
      }; });
    const moveIn = (list) => (from, to) => { if (from===to || to<0 || to>=list.length) return false; const [m] = list.splice(from, 1); list.splice(to, 0, m); return true; };
    const field = (id, set) => { const el = document.getElementById(id);
      if (el) el.oninput = () => { set(el.value); const had = !!E.id; keepDraft(true); if (E.delArm || had !== !!E.id) { E.delArm = false; E.focus = id; render(); } }; return el; };
    field('tName', (v)=>{ d.name = v; });
    /* tags and assignees: Enter (or a comma) makes a capsule */
    function settlePending(){
      const v = (d.stIn||'').trim(); if (v) d.steps.push({ done:false, text:v, due:'', repeat:null, last:'' }); d.stIn = '';
      if (addUpdate(d, d.upIn)) d.upIn = '';
      const lv = (d.lkIn||'').trim(); if (lv) d.links.push({ label:siteOf(linkUrl(lv)), url:lv }); d.lkIn = '';
      addCost(); }
    const settleBox = (field_, inKey) => { for (const x of list(d[inKey])) if (!d[field_].some((h)=>same(h, x))) d[field_].push(x); d[inKey] = ''; };
    const box = (id, field_, inKey) => { const el = document.getElementById(id); if (!el) return;
      el.oninput = () => { d[inKey] = el.value; if (/,/.test(el.value)) { settleBox(field_, inKey); redraw(id); } };
      el.onkeydown = (e) => {
        if (e.key==='Enter') { if (e.preventDefault) e.preventDefault(); settleBox(field_, inKey); redraw(id); }
        else if (e.key==='Backspace' && !el.value && d[field_].length) { d[field_].pop(); redraw(id); } }; };
    box('tTagIn', 'tags', 'tagIn'); box('tAsgIn', 'assignees', 'asgIn');
    on('ptagx', (i)=>{ d.tags.splice(+i, 1); redraw(); });
    on('pasgx', (i)=>{ d.assignees.splice(+i, 1); redraw(); });
    on('ptagadd', (k)=>{ if (!d.tags.some((h)=>same(h, k))) d.tags.push(k); redraw(); });
    on('pasgadd', (k)=>{ if (!d.assignees.some((h)=>same(h, k))) d.assignees.push(k); redraw(); });
    on('pstat', (s)=>{ d.status = s; E.statPick = false; redraw(); });
    /* the next steps: Enter in the last line adds one, ready for the next;
       each can take a due date */
    d.steps.forEach((s, i) => { field('tSt'+i, (v)=>{ s.text = v; });
      /* a new date re-sets what a repeat falls on (the 12th, the 2nd Tue, 12 Nov) */
      field('tSd'+i, (v)=>{ s.due = v; if (s.repeat && v) s.repeat = anchored(s.repeat, v); }); });
    const st = document.getElementById('tStIn');
    if (st) { st.oninput = () => { d.stIn = st.value; };
      st.onkeydown = (e) => { if (e.key!=='Enter') return; if (e.preventDefault) e.preventDefault();
        const v = (d.stIn||'').trim(); if (v) d.steps.push({ done:false, text:v, due:'', repeat:null, last:'' }); d.stIn = ''; redraw('tStIn'); }; }
    on('pckt', (i)=>{ const s = d.steps[+i]; if (s) tickStep(s); redraw(); });
    /* the repeat: ↻ turns it on (dated today if it had no date) and opens it */
    on('prep', (i)=>{ const st = d.steps[+i]; if (!st) return;
      if (!st.repeat) { if (!st.due) st.due = TODAY(); st.repeat = anchored({ n:1, unit:'week', days:[] }, st.due); st.done = false; E.rep = +i; }
      else E.rep = E.rep===+i ? null : +i;
      redraw(); });
    const R = E.rep!=null ? d.steps[E.rep] : null;
    if (R && R.repeat) {
      const rn = document.getElementById('tRn');
      if (rn) rn.oninput = () => { const v = parseInt(rn.value, 10); if (v > 0) { R.repeat.n = Math.min(v, 99); keepDraft(true); } };
      if (rn) rn.onchange = () => redraw();
      on('prunit', (u)=>{ R.repeat = anchored({ ...R.repeat, unit:u, days:[], day:R.repeat.day===-1 && u==='month' ? -1 : 0 }, R.due); redraw(); });
      on('prwd', (w)=>{ const x = +w, ds = R.repeat.days; R.repeat.days = ds.includes(x) ? (ds.length>1 ? ds.filter((y)=>y!==x) : ds) : ds.concat([x]); R.repeat = canon(R.repeat); redraw(); });
      on('prby', (k)=>{ const dd = dOf(R.due), r = { ...R.repeat, by: k==='weekday' || k==='lastwd' ? 'weekday' : 'date', day: k==='lastday' ? -1 : dd.getDate(), nth: k==='lastwd' ? -1 : Math.ceil(dd.getDate()/7), wd: dd.getDay() }; R.repeat = canon(r); redraw(); });
      on('proff', ()=>{ R.repeat = null; R.last = ''; E.rep = null; redraw(); });
    }
    on('pckx', (i)=>twoTap('st'+i, ()=>{ d.steps.splice(+i, 1); E.rep = null; }));
    /* the order: drag a line by its handle; an open repeat follows its step */
    dragRows('pstdrag', 'pstrow', 'st', moveStep);
    dragRows('pcodrag', 'pcorow', 'co', moveIn(d.costs));
    dragRows('pupdrag', 'puprow', 'up', moveIn(d.updates));
    /* updates: a new one dated today goes on top; the older ones edited in place */
    d.updates.forEach((u, i) => field('tUp'+i, (v)=>{ u.text = v; }));
    const up = document.getElementById('tUpIn');
    if (up) up.oninput = () => { d.upIn = up.value; };
    on('pupadd', ()=>{ if (addUpdate(d, d.upIn)) d.upIn = ''; redraw(); });
    on('pupx', (i)=>twoTap('up'+i, ()=>{ d.updates.splice(+i, 1); }));
    /* links: paste (or type) one and press Enter; a label can follow */
    d.links.forEach((l, i) => { field('tLkU'+i, (v)=>{ l.url = v; }); field('tLkL'+i, (v)=>{ l.label = v; }); });
    const lk = document.getElementById('tLkIn');
    if (lk) { lk.oninput = () => { d.lkIn = lk.value; };
      lk.onkeydown = (e) => { if (e.key!=='Enter') return; if (e.preventDefault) e.preventDefault();
        const v = (d.lkIn||'').trim(); if (v) d.links.push({ label:siteOf(linkUrl(v)), url:v }); d.lkIn = ''; redraw('tLkL'+(d.links.length-1)); }; }
    on('plkx', (i)=>twoTap('lk'+i, ()=>{ d.links.splice(+i, 1); }));
    /* costs: the currency of the last line is the one a new line starts in */
    d.costs.forEach((c, i) => { field('tCoN'+i, (v)=>{ c.name = v; }); field('tCoA'+i, (v)=>{ c.amount = v; }); });
    /* the empty line at the bottom: Enter (in the name or the amount) adds it, in the last line's currency */
    const addCost = () => { const n = (d.coN||'').trim(), a = (d.coA||'').trim(); if (!n && !a) return false;
      const last = d.costs[d.costs.length-1]; d.costs.push({ name:n, amount:a, cur: last ? last.cur : 'EUR', paid:false }); d.coN = ''; d.coA = ''; return true; };
    const coN = document.getElementById('tCoNIn'), coA = document.getElementById('tCoAIn');
    if (coN) { coN.oninput = () => { d.coN = coN.value; }; coN.onkeydown = (ev) => { if (ev.key!=='Enter') return; if (ev.preventDefault) ev.preventDefault();
      if (!(d.coA||'').trim()) { E.focus = 'tCoAIn'; render(); return; } addCost(); redraw('tCoNIn'); }; }
    if (coA) { coA.oninput = () => { d.coA = coA.value; }; coA.onkeydown = (ev) => { if (ev.key!=='Enter') return; if (ev.preventDefault) ev.preventDefault(); addCost(); redraw('tCoNIn'); }; }
    on('pcocur', (v)=>{ const [i, c] = v.split('|'); if (d.costs[+i]) d.costs[+i].cur = c; redraw(); });
    on('pcox', (i)=>twoTap('co'+i, ()=>{ d.costs.splice(+i, 1); }));
    on('pcopaid', (i)=>{ const c = d.costs[+i]; if (c) { c.paid = !c.paid; redraw(); } });
    /* Close: what is half-typed counts; back to the task's page (or the
       list, when nothing was ever named) */
    on('eclose', ()=>{ settleBox('tags', 'tagIn'); settleBox('assignees', 'asgIn'); settlePending();
      keepDraft(true); state.view = null; state.edit = null; state.statPick = false; render(); });
    on('pdel', ()=>{ if (E.delArm!=='task') { E.delArm = 'task'; render(); return; }
      const t = store.tasks.find((x)=>x.id===E.id); state.edit = null; state.view = null;
      if (t) { t.deleted = NOW(); t.updated = t.deleted; commit('T:'+t.id); } else render(); });
  }

  if (state.tab==='care') wireCare();

  /* settings */
  const u = document.getElementById('bkUrl'), k = document.getElementById('bkTok');
  if (u) u.oninput = () => { store.backend.url = u.value.trim(); save(); };
  if (k) k.oninput = () => { store.backend.token = k.value.trim(); save(); };
  on('bktest', async()=>{
    state.sync = { msg:'Testing…' }; render();
    try { const j = await BK.ping(store.backend); store.backendVersion = j.backend; save(); state.sync = { msg:'Connected · backend v' + j.backend }; }
    catch (e) { state.sync = { msg:e.message, bad:true }; }
    render(); });
  on('bksync', ()=>syncNow(false));
  on('export', ()=>{ try { downloadExport(); state.io = { msg:'Exported ' + live().length + ' tasks' }; } catch (e) { state.io = { msg:e.message, bad:true }; } render(); });
  const fi = document.getElementById('impFile');
  if (fi) fi.onchange = () => { const f = fi.files && fi.files[0]; fi.value = ''; importFile(f); };
  on('import', ()=>{ if (fi) fi.click(); });
}

render();
/* Open: read the sheet (and send what waited). Back on screen: again. */
if (connected()) syncNow(true);
if (typeof document.addEventListener === 'function') document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && connected()) syncNow(true); });

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
